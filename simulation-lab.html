const MODES = [galton, projectile, forceField, pendulum, lorenz, orbits, waves, logistic, boids, solarSystem, rossler, brownian, decay, lagrange, oscillators, electric, lorentz, resonance, life, kuramoto, milkyway, universe, standing, doppler, packet, soliton, timbre, circlePi, polygonPi, doublePendulum, pendulumWave, vibratingString, fourier, billiard, duffing, idealGas, epidemic, forestFire, langton, spaceship, cockpit, syncPendula, collatz, mandelbrot, epicycles, newtonFractal, seriesZoo, standardMap, threeBody, eulerDisk, beadOnWire, rutherford];
let modeIndex = 0;
let frameCount = 0;

function setStatus(msg) { $("statustext").textContent = msg; }

let errCount = 0, lastErrTime = 0;
function eqRuntimeError(e) {
  errCount++;
  const now = performance.now();
  if (now - lastErrTime > 400) {
    lastErrTime = now;
    $("eqerr").style.display = "block";
    $("eqerr").textContent = `runtime error (×${errCount}): ${e.message}`;
    $("eqok").style.display = "none";
  }
}

function categoryOrder(cat) {
  const order = ["Classical Dynamics", "Celestial Mechanics", "Statistical", "Waves", "Fields", "Emergent Systems", "Chaos", "Relativity", "Mathematical"];
  const i = order.indexOf(cat);
  return i === -1 ? order.length : i;
}
let collapsedCats = new Set();
function buildMenu() {
  const wrap = $("simMenu"); wrap.innerHTML = "";
  const q = $("simSearch").value.trim().toLowerCase();
  const cats = {};
  MODES.forEach(m => { (cats[m.category] = cats[m.category] || []).push(m); });
  const names = Object.keys(cats).sort((a, b) => categoryOrder(a) - categoryOrder(b));
  let anyVisible = false;
  for (const cat of names) {
    const list = cats[cat];
    const matches = q ? list.filter(m => (m.label + " " + m.category).toLowerCase().includes(q)) : list;
    if (q && matches.length === 0) continue;
    anyVisible = true;
    const closed = collapsedCats.has(cat) && !q;
    const sec = document.createElement("div");
    const head = document.createElement("div");
    head.className = "simcat" + (closed ? " closed" : "");
    head.innerHTML = `<span>${cat}</span><span class="caret">▼</span>`;
    head.onclick = () => {
      if (collapsedCats.has(cat)) collapsedCats.delete(cat); else collapsedCats.add(cat);
      buildMenu();
    };
    const rows = document.createElement("div"); rows.className = "simrows";
    for (const m of matches) {
      const idx = MODES.indexOf(m);
      const r = document.createElement("div");
      r.className = "simrow" + (m === mode ? " active" : "");
      r.innerHTML = `<span>${m.label}</span>${idx < 9 ? `<span class="key">${idx + 1}</span>` : ""}`;
      r.onclick = () => switchMode(idx);
      rows.appendChild(r);
    }
    if (closed && !q) rows.style.display = "none";
    sec.append(head, rows);
    wrap.appendChild(sec);
  }
  $("simNone").style.display = anyVisible ? "none" : "block";
}
$("simSearch").addEventListener("input", buildMenu);
$("menuToggle").onclick = () => {
  const allClosed = MODES.every(m => collapsedCats.has(m.category));
  if (allClosed) {
    collapsedCats.clear();
    $("menuToggle").textContent = "collapse all";
  } else {
    MODES.forEach(m => collapsedCats.add(m.category));
    $("menuToggle").textContent = "expand all";
  }
  buildMenu();
};

function buildParams() {
  const wrap = $("params"); wrap.innerHTML = "";
  for (const pd of mode.params) {
    const row = document.createElement("div"); row.className = "param";
    const lab = document.createElement("label"); lab.textContent = pd.label;
    const inp = document.createElement("input");
    inp.type = "range"; inp.min = pd.min; inp.max = pd.max; inp.step = pd.step; inp.value = mode.P[pd.key];
    const val = document.createElement("span"); val.className = "val"; val.textContent = fmtVal(mode.P[pd.key]);
    inp.oninput = () => {
      mode.P[pd.key] = parseFloat(inp.value);
      val.textContent = fmtVal(mode.P[pd.key]);
      saveParam(mode.id, pd.key, mode.P[pd.key]);
      if (mode.onParam) mode.onParam(pd.key);
      workerRefresh();
    };
    row.append(lab, inp, val); wrap.appendChild(row);
  }
}
function fmtVal(v) { return Math.abs(v) >= 100 ? Math.round(v).toString() : (+v).toFixed(2).replace(/\.?0+$/, ""); }

function buildPresets() {
  const wrap = $("presets"); wrap.innerHTML = "";
  if (!mode.presets) { $("presetSection").style.display = "none"; return; }
  $("presetSection").style.display = "block";
  mode.presets.forEach(p => {
    const b = document.createElement("button"); b.className = "preset";
    b.textContent = p.name;
    b.onclick = () => {
      if (p.code) { $("eqeditor").value = p.code; applyEquation(); }
      if (p.params) { Object.assign(mode.P, p.params); buildParams(); }
      if (p.state && mode.applyState) mode.applyState(p.state);
      if (mode.onPreset) mode.onPreset(p);
      markPreset(p.name);
    };
    if (p.name === mode.defaultPresetName) b.classList.add("active");
    wrap.appendChild(b);
  });
  markPreset(null);
}
function markPreset(name) {
  document.querySelectorAll(".preset").forEach(b => b.classList.toggle("active", b.textContent === name));
}

function applyEquation() {
  const code = $("eqeditor").value;
  const spec = mode.eqSpec;      // {argNames, mustReturn}
  const res = compileEq(code, spec.argNames, spec.mustReturn);
  if (res.err) {
    $("eqerr").style.display = "block"; $("eqerr").textContent = res.err;
    $("eqok").style.display = "none";
    return false;
  }
  mode.eq = res.fn;
  if (mode.onEquation) mode.onEquation();
  saveEq(mode.id);
  workerRefresh();
  $("eqerr").style.display = "none";
  $("eqok").style.display = "block";
  setTimeout(() => { $("eqok").style.display = "none"; }, 1200);
  return true;
}

function clearParticles() { particles = []; clearLanding(); }

function switchMode(i) {
  modeIndex = i;
  mode = MODES[i];
  stopSimWorker();
  clearParticles();
  // init params from defaults, then restore any saved slider values
  mode.P = {};
  for (const pd of mode.params) mode.P[pd.key] = pd.value;
  const savedP = store().p && store().p[mode.id];
  if (savedP) for (const k in savedP) if (k in mode.P && isFinite(savedP[k])) mode.P[k] = savedP[k];
  mode.init();
  seriesRing.length = 0;
  buildMenu();
  const act = document.querySelector(".simrow.active");
  if (act && act.scrollIntoView) act.scrollIntoView({ block: "nearest" });
  $("eqname").textContent = mode.eqName;
  $("eqsig").textContent = mode.eqSig;
  $("eqdesc").textContent = mode.eqDesc;
  const savedEq = store().eq && store().eq[mode.id];
  $("eqeditor").value = savedEq != null ? savedEq : mode.defaultCode;
  buildParams();
  buildPresets();
  applyEquation();
  $("hint").textContent = mode.hint;
  $("histoLabel").textContent = mode.histLabel || "Distribution of final X";
  setStatus(mode.label + " — ready");
  resize();
  startSimWorker();
}

// ---------- histogram ------------------------------------------------------
function drawHistogram() {
  if (!hist.dirty && !hist._force) return;
  hist._force = true; // redraw cheap enough; keep simple
  hctx.clearRect(0, 0, HW, HH);
  const pad = { l: 8, r: 8, t: 8, b: 16 };
  const iw = HW - pad.l - pad.r, ih = HH - pad.t - pad.b;

  const nBins = parseInt($("bins").value, 10);
  const [x0, x1] = (mode && mode.xRange) ? mode.xRange() : [0, W];
  const bins = new Array(nBins).fill(0);
  let n = 0;
  for (const x of hist.xs) {
    if (x < x0 || x > x1) continue;
    let b = Math.floor((x - x0) / (x1 - x0) * nBins);
    b = clamp(b, 0, nBins - 1);
    bins[b]++; n++;
  }
  const maxC = Math.max(1, ...bins);

  // bars
  const bw = iw / nBins;
  for (let i = 0; i < nBins; i++) {
    const h = bins[i] / maxC * ih;
    hctx.fillStyle = "rgba(88,166,255,.75)";
    hctx.fillRect(pad.l + i * bw + 1, pad.t + ih - h, Math.max(1, bw - 2), h);
  }

  // theoretical overlay: normal fit from sample mean/σ
  if (n > 10 && $("showTheory").checked) {
    let mean = 0; for (const x of hist.xs) mean += x; mean /= n;
    let varr = 0; for (const x of hist.xs) varr += (x - mean) * (x - mean); varr /= n;
    const sd = Math.sqrt(varr) || 1;
    hctx.strokeStyle = "#3fb950"; hctx.lineWidth = 2; hctx.beginPath();
    for (let px = 0; px <= iw; px += 2) {
      const x = x0 + px / iw * (x1 - x0);
      const z = (x - mean) / sd;
      const pdf = Math.exp(-0.5 * z * z) / (sd * Math.sqrt(2 * Math.PI));
      // scale so peak matches maxC
      const yv = pdf * n * ((x1 - x0) / nBins) / maxC * ih; // expected count in peak bin
      const py = pad.t + ih - clamp(yv, 0, ih);
      if (px === 0) hctx.moveTo(pad.l + px, py); else hctx.lineTo(pad.l + px, py);
    }
    hctx.stroke();
    // mean marker
    const mx = pad.l + (mean - x0) / (x1 - x0) * iw;
    hctx.strokeStyle = "rgba(63,185,80,.5)"; hctx.setLineDash([4, 4]);
    hctx.beginPath(); hctx.moveTo(mx, pad.t); hctx.lineTo(mx, pad.t + ih); hctx.stroke();
    hctx.setLineDash([]);
  }

  // stats
  let mean = 0, sd = 0, skew = 0, kurt = 0;
  if (n > 0) {
    for (const x of hist.xs) mean += x; mean /= n;
    for (const x of hist.xs) sd += (x - mean) * (x - mean); sd = Math.sqrt(sd / n) || 1;
    for (const x of hist.xs) { const z = (x - mean) / sd; skew += z ** 3; kurt += z ** 4; }
    skew /= n; kurt /= n;
  }
  $("histostats").textContent = `n=${n}  μ=${mean.toFixed(1)}  σ=${sd.toFixed(1)}`;
  // shape stats drawn on the plot itself
  hctx.font = "10px ui-monospace, monospace";
  hctx.fillStyle = "rgba(230,237,243,.55)";
  const norm = Math.abs(skew) < 0.3 && kurt > 2.4 && kurt < 3.6;
  hctx.fillText(`skew ${skew.toFixed(2)}  kurtosis ${kurt.toFixed(2)}  ${norm ? "≈normal ✓" : ""}`, pad.l + 4, pad.t + 10);
  hist.dirty = false;
}

// ---------- analysis: live measures + time-series ----------------------------
// A generic readout bar + sparkline. Modes may implement `measures()` returning
// an object of {label: formattedValue} shown in the readout, and `series()`
// returning a single number to plot over time. Defaults are computed from the
// mode's primary field array so every mode gains value with zero edits.
const seriesRing = [];                       // [{t, v}] ring buffer
const SERIES_MAX = 6000;
function primaryField(m) {
  for (const k of ["u", "y", "psi", "z", "field"]) if (ArrayBuffer.isView(m[k]) && m[k].length) return m[k];
  return null;
}
function simTimeOf(m) {
  if (typeof m.t === "number") return m.t;
  if (typeof m.tSim === "number") return m.tSim;
  if (typeof m.simT === "number") return m.simT;
  return simTime;
}
function fieldStats(field) {
  if (!field) return null;
  let mn = Infinity, mx = -Infinity, peak = 0, sum = 0;
  for (let i = 0; i < field.length; i++) {
    const v = field[i];
    if (!isFinite(v)) continue;
    if (v < mn) mn = v; if (v > mx) mx = v;
    const a = Math.abs(v); if (a > peak) peak = a; sum += v;
  }
  return { mn, mx, peak, mean: sum / field.length };
}
function defaultMeasures(m) {
  const out = {};
  out["sim t"] = simTimeOf(m).toFixed(3) + "s";
  const fs = fieldStats(primaryField(m));
  if (fs) {
    out["field"] = fs.peak.toPrecision(3);
    out["min"] = fs.mn.toPrecision(3);
    out["max"] = fs.mx.toPrecision(3);
  }
  return out;
}
function defaultSeries(m) {
  const fs = fieldStats(primaryField(m));
  if (fs) return fs.peak;
  if (m.ps && m.ps.length) { let n = 0; for (const p of m.ps) if (!isFinite(p.x) && false) {} return m.ps.length; }
  return hist.xs.length;
}
function collectMeasures() {
  if (!mode) return {};
  if (mode.measures) { const x = mode.measures(); if (x && typeof x === "object" && !Array.isArray(x)) return x; }
  return defaultMeasures(mode);
}
function collectSeries() {
  const v = (mode && mode.series) ? mode.series() : defaultSeries(mode);
  return isFinite(v) ? v : 0;
}
function recordSeries(t) {
  const v = collectSeries();
  seriesRing.push({ t, v });
  if (seriesRing.length > SERIES_MAX) seriesRing.splice(0, seriesRing.length - SERIES_MAX);
}
function updateReadouts() {
  const box = $("readouts");
  if (!$("showReadouts").checked || !mode) { box.style.display = "none"; return; }
  box.style.display = "block";
  const ms = collectMeasures();
  const lines = [];
  let first = true;
  for (const k in ms) {
    lines.push(`<span class="${first ? '' : 'muted'}">${k} <b>${ms[k]}</b></span>`);
    first = false;
  }
  if (seriesRing.length) {
    const last = seriesRing[seriesRing.length - 1];
    lines.push(`<span class="muted">time-series · current <b>${last.v.toPrecision(3)}</b></span>`);
  }
  box.innerHTML = lines.join("<br>");
}
function drawSpark() {
  if (!$("showSpark").checked || seriesRing.length < 2) { sctx.clearRect(0, 0, sparkCanvas.width, sparkCanvas.height); return; }
  const dpr = window.devicePixelRatio || 1;
  const w = 220, h = 64;
  if (sparkCanvas.width !== w * dpr) { sparkCanvas.width = w * dpr; sparkCanvas.height = h * dpr; }
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  let mn = Infinity, mx = -Infinity;
  for (const s of seriesRing) { if (s.v < mn) mn = s.v; if (s.v > mx) mx = s.v; }
  if (mx === mn) mx = mn + 1;
  const pad = 4;
  const t0 = seriesRing[0].t, t1 = seriesRing[seriesRing.length - 1].t;
  const x = s => pad + (t1 === t0 ? 0.5 : (s.t - t0) / (t1 - t0)) * (w - 2 * pad);
  const y = v => h - pad - (v - mn) / (mx - mn) * (h - 2 * pad);
  sctx.strokeStyle = "rgba(48,54,61,.9)"; sctx.lineWidth = 1;
  sctx.strokeRect(pad, pad - 1, w - 2 * pad, h - 2 * pad + 1);
  sctx.strokeStyle = "#58a6ff"; sctx.lineWidth = 1.5; sctx.beginPath();
  for (let i = 0; i < seriesRing.length; i++) { const s = seriesRing[i]; if (i === 0) sctx.moveTo(x(s), y(s.v)); else sctx.lineTo(x(s), y(s.v)); }
  sctx.stroke();
  // baseline zero
  if (mn < 0 && mx > 0) {
    sctx.strokeStyle = "rgba(63,185,80,.35)"; sctx.lineWidth = 1; sctx.setLineDash([3, 3]);
    sctx.beginPath(); sctx.moveTo(pad, y(0)); sctx.lineTo(w - pad, y(0)); sctx.stroke(); sctx.setLineDash([]);
  }
  sctx.fillStyle = "rgba(139,148,158,.85)"; sctx.font = "9px ui-monospace, monospace";
  sctx.fillText(`${mn.toPrecision(2)} … ${mx.toPrecision(2)}`, pad + 2, h - 2);
}

// ---------- export: CSV + PNG ----------------------------------------------
function download(name, blob) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$("btnCsv").onclick = () => {
  const nBins = parseInt($("bins").value, 10);
  const [x0, x1] = mode.xRange ? mode.xRange() : [0, W];
  const bins = new Array(nBins).fill(0);
  for (const x of hist.xs) {
    if (x < x0 || x > x1) continue;
    bins[clamp(Math.floor((x - x0) / (x1 - x0) * nBins), 0, nBins - 1)]++;
  }
  const bw = (x1 - x0) / nBins;
  let csv = `# ${mode.label} — ${mode.histLabel || "distribution"}\nbin_start,bin_end,count\n`;
  bins.forEach((c, i) => { csv += `${(x0 + i * bw).toFixed(4)},${(x0 + (i + 1) * bw).toFixed(4)},${c}\n`; });
  download(`histogram-${mode.id}.csv`, new Blob([csv], { type: "text/csv" }));
  setStatus("CSV exported");
};
$("btnPng").onclick = () => {
  // composite sim canvas + histogram into one snapshot
  const out = document.createElement("canvas");
  out.width = canvas.width; out.height = canvas.height + hcanvas.height;
  const c = out.getContext("2d");
  c.drawImage(canvas, 0, 0);
  c.drawImage(hcanvas, 0, canvas.height);
  out.toBlob(b => { download(`snapshot-${mode.id}.png`, b); setStatus("PNG saved"); });
};

// ---------- persistence: your equations & slider values survive reloads -----
function store() { try { return JSON.parse(localStorage.getItem("simlab") || "{}") || {}; } catch (e) { return {}; } }
function saveStore(mut) {
  try { const s = store(); mut(s); localStorage.setItem("simlab", JSON.stringify(s)); } catch (e) {}
}
const saveEq = modeId => saveStore(s => { (s.eq = s.eq || {})[modeId] = $("eqeditor").value; });
const saveParam = (modeId, key, val) => saveStore(s => { ((s.p = s.p || {})[modeId] = s.p[modeId] || {})[key] = val; });

// ---------- snapshots: named full-state captures + shareable links ----------
const SNAP_KEY = "simlab.snaps";
function snapStore() { try { return JSON.parse(localStorage.getItem(SNAP_KEY) || "{}") || {}; } catch (e) { return {}; } }
function saveSnaps(mut) {
  try { const s = snapStore(); mut(s); localStorage.setItem(SNAP_KEY, JSON.stringify(s)); } catch (e) {}
  renderSnaps();
}
function captureSnapshot(name) {
  const P = {}; for (const k in mode.P) P[k] = mode.P[k];
  return { name, modeId: mode.id, P, eq: $("eqeditor").value, savedAt: Date.now() };
}
function renderSnaps() {
  const wrap = $("snaps"); wrap.innerHTML = "";
  const snaps = snapStore();
  const keys = Object.keys(snaps).sort((a, b) => (snaps[b].savedAt || 0) - (snaps[a].savedAt || 0));
  if (keys.length === 0) { wrap.innerHTML = '<span style="color:var(--muted);font-size:11px">No snapshots yet — capture a state you want to revisit or share.</span>'; return; }
  for (const key of keys) {
    const s = snaps[key];
    const item = document.createElement("div"); item.className = "snapitem";
    const name = document.createElement("span"); name.className = "sname"; name.textContent = s.name || "untitled"; name.title = s.name || "";
    const sm = document.createElement("span"); sm.className = "smode";
    const m = MODES.find(x => x.id === s.modeId); sm.textContent = m ? m.label : s.modeId;
    const btnRestore = document.createElement("button"); btnRestore.className = "topbtn"; btnRestore.textContent = "load";
    btnRestore.title = "Restore this exact state"; btnRestore.onclick = () => restoreSnapshot(key);
    const btnLink = document.createElement("button"); btnLink.className = "topbtn"; btnLink.textContent = "🔗";
    btnLink.title = "Copy a shareable link"; btnLink.onclick = () => copySnapshotLink(key);
    const btnDel = document.createElement("button"); btnDel.className = "topbtn"; btnDel.textContent = "✕";
    btnDel.title = "Delete snapshot"; btnDel.onclick = () => { saveSnaps(s => { delete s[key]; }); };
    item.append(name, sm, btnRestore, btnLink, btnDel);
    wrap.appendChild(item);
  }
}
function restoreSnapshot(key) {
  const s = snapStore()[key];
  if (!s) { setStatus("snapshot not found"); return; }
  const idx = MODES.findIndex(x => x.id === s.modeId);
  if (idx < 0) { setStatus("snapshot's mode no longer exists"); return; }
  switchMode(idx);
  if (s.P) { mode.P = {}; for (const pd of mode.params) mode.P[pd.key] = pd.value; Object.assign(mode.P, s.P); buildParams(); }
  if (typeof s.eq === "string") { $("eqeditor").value = s.eq; applyEquation(); }
  if (mode.init) mode.init();
  buildPresets();
  setStatus("snapshot restored: " + (s.name || "untitled"));
}
function snapshotPayload(s) {
  const P = s.P || {};
  return {
    v: 1,
    mode: s.modeId,
    p: P,
    e: typeof s.eq === "string" ? s.eq : ($("eqeditor").value),
  };
}
function currentPayload() {
  const P = {}; for (const k in mode.P) P[k] = mode.P[k];
  return { v: 1, mode: mode.id, p: P, e: $("eqeditor").value };
}
function b64url(obj) {
  const b = new TextEncoder().encode(JSON.stringify(obj));
  let bin = ""; for (let i = 0; i < b.length; i++) bin += String.fromCharCode(b[i]);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function b64decode(str) {
  const s = str.replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(bytes));
}
function copyCurrentLink() {
  const payload = currentPayload();
  const url = location.href.split("#")[0] + "#s=" + b64url(payload);
  copyText(url);
  setStatus("share link copied — open it anywhere to reload this exact state");
}
function copySnapshotLink(key) {
  const s = snapStore()[key];
  if (!s) { setStatus("snapshot not found"); return; }
  const url = location.href.split("#")[0] + "#s=" + b64url(snapshotPayload(s));
  copyText(url);
  setStatus("share link copied");
}
function copyText(txt) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(() => {}, () => fallbackCopy(txt));
  } else fallbackCopy(txt);
}
function fallbackCopy(txt) {
  const ta = document.createElement("textarea");
  ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  ta.remove();
}
function applySharedPayload(payload) {
  if (!payload || typeof payload.mode !== "string") return;
  const idx = MODES.findIndex(x => x.id === payload.mode);
  if (idx < 0) { setStatus("shared mode not found"); return; }
  switchMode(idx);
  if (payload.p) { mode.P = {}; for (const pd of mode.params) mode.P[pd.key] = pd.value; Object.assign(mode.P, payload.p); buildParams(); }
  if (typeof payload.e === "string") { $("eqeditor").value = payload.e; applyEquation(); }
  if (mode.init) mode.init();
  buildPresets();
  setStatus("shared state applied: " + mode.label);
}
function loadShareHash() {
  const h = location.hash || "";
  const mm = h.match(/#s=([A-Za-z0-9_-]+)/);
  if (!mm) return;
  try { applySharedPayload(b64decode(mm[1])); } catch (e) { setStatus("could not read shared link"); }
}
$("btnSnapSave").onclick = () => {
  let name = $("snapName").value.trim();
  if (!name) name = "snap " + (Object.keys(snapStore()).length + 1) + " · " + mode.label;
  saveSnaps(s => { s["@" + Date.now().toString(36)] = captureSnapshot(name); });
  $("snapName").value = "";
  setStatus("snapshot saved: " + name);
};
$("snapName").addEventListener("keydown", e => { if (e.key === "Enter") $("btnSnapSave").click(); });
$("btnShareLink").onclick = copyCurrentLink;
$("snapClear").onclick = () => { if (confirm("Delete all snapshots?")) saveSnaps(s => { for (const k in s) delete s[k]; }); };
renderSnaps();

// ---------- web worker offload ----------------------------------------------
// Modes marked `worker: true` keep ALL simulation state on `this.*` and never
// touch the DOM inside `step()`, so their heavy integration can run off the
// main thread, keeping the equation editor + sliders responsive. The worker is
// a Blob built from the mode's own method sources (no duplication of physics),
// so worker output is bit-identical to running `step()` synchronously. Falls
// back to the synchronous path automatically when workers are unavailable or
// offload is toggled off.
const WORKER_CHUNK = 8;
let simWorker = null, workerBusy = false, workerActive = false;
function workerEnabled() { return typeof Worker !== "undefined" && $("useWorker") && $("useWorker").checked && mode && mode.worker; }
function collectWorkerFuncs(m) {
  const out = {};
  for (const k in m) if (typeof m[k] === "function") out[k] = m[k].toString();
  return out;
}
function collectWorkerState(m) {
  const out = {};
  for (const k in m) if (typeof m[k] !== "function") out[k] = m[k];
  return out;
}
// Convert a method's source string into a valid function *expression*:
//   "init() { ... }"  (object method shorthand) -> "(function init() { ... })"
//   "() => {...}" / "function f(){}" / "(x)=>x" -> passed through
function methodExpr(src) {
  const s = src.trim();
  if (/^(function\b|\(|[A-Za-z_$][\w$]*\s*=>)/.test(s)) return "(" + s + ")";
  if (/^[A-Za-z_$][\w$]*\s*\(/.test(s)) return "(function " + s + ")";
  return "(" + s + ")";
}
function buildWorkerSrc(m, funcs) {
  const fnParts = [];
  for (const k in funcs) fnParts.push(`mode.${k} = ${methodExpr(funcs[k])};`);
  return `"use strict";
// ---- shared helpers (worker must be self-contained) ----
let __hist = [];
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function pushSample(x) { if (isFinite(x)) { __hist.push(x); if (__hist.length > 40000) __hist.splice(0, __hist.length - 40000); } }
function eqRuntimeError() {}
let __rngState = 123456789;
function rng() { __rngState = (Math.imul(__rngState, 1103515245) + 12345) & 0x7fffffff; return __rngState / 0x7fffffff; }
// ---- mode reconstruction ----
let mode = {};
${fnParts.join("\n")}
let P = {};
function compileEq(code, argNames) { try { return new Function(...argNames, '"use strict";\\n' + (code || "")); } catch (e) { return null; } }
function applySetup(d) {
  P = d.P || {};
  for (const k in d.state) mode[k] = d.state[k];
  mode.P = P;
  mode.eq = compileEq(d.code, d.argNames);
  if (typeof mode.init === "function") mode.init();
}
function workerWire() {
  self.onmessage = (e) => {
    const d = e.data;
    if (d.cmd === "setup") { applySetup(d); postMessage({ cmd: "ok" }); }
    else if (d.cmd === "run") {
      __hist.length = 0;
      let steps = 0;
      for (let i = 0; i < d.steps; i++) { if (mode.eq) mode.step(d.dt); steps++; }
      const out = { cmd: "done", steps, hist: __hist.slice(), P: mode.P };
      for (const k in mode) if (typeof mode[k] !== "function") out[k] = mode[k];
      postMessage(out);
    }
  };
}
workerWire();
`;
}
function startSimWorker() {
  stopSimWorker();
  if (!workerEnabled()) { workerActive = false; return false; }
  try {
    const funcs = collectWorkerFuncs(mode);
    const src = buildWorkerSrc(mode, funcs);
    const blob = new Blob([src], { type: "text/javascript" });
    simWorker = new Worker(URL.createObjectURL(blob));
    workerBusy = true;
    simWorker.onmessage = onWorkerMessage;
    simWorker.postMessage({ cmd: "setup", P: mode.P, code: $("eqeditor").value, argNames: mode.eqSpec.argNames, state: collectWorkerState(mode) });
    workerActive = true;
    return true;
  } catch (e) { stopSimWorker(); workerActive = false; return false; }
}
function stopSimWorker() {
  if (simWorker) { try { simWorker.terminate(); } catch (e) {} simWorker = null; }
  workerActive = false; workerBusy = false;
}
function workerRefresh() {
  // re-sync worker after param/eq/init changes on the main thread
  if (!simWorker || !workerActive) return;
  workerBusy = true;
  simWorker.postMessage({ cmd: "setup", P: mode.P, code: $("eqeditor").value, argNames: mode.eqSpec.argNames, state: collectWorkerState(mode) });
}
function onWorkerMessage(e) {
  const d = e.data;
  if (!d) return;
  if (d.cmd === "ok") { workerBusy = false; return; }
  if (d.cmd === "done") {
    // apply returned state back onto the authoritative mode for drawing
    for (const k in d) { if (k === "cmd" || k === "steps" || k === "hist" || k === "P") continue; mode[k] = d[k]; }
    if (d.P) for (const k in d.P) mode.P[k] = d.P[k];
    if (d.hist) for (const x of d.hist) pushSample(x);
    simTime += (d.steps || 0) * DT;
    if (d.steps) recordSeries(simTime);
    updateReadouts();
    drawSpark();
    workerBusy = false;
  }
}
$("useWorker").onchange = () => {
  if (workerEnabled()) startSimWorker(); else stopSimWorker();
  setStatus(workerActive ? "worker offload on" : "worker offload off");
};

// ---------- buttons / keys -------------------------------------------------
$("btnDrop").onclick = () => { mode.drop(mode.id === "force" ? mode.P.n : 100); workerRefresh(); };
$("btnPause").onclick = togglePause;
$("btnClear").onclick = () => { clearParticles(); setStatus("cleared"); };
$("speed").oninput = e => { speedMul = parseFloat(e.target.value); $("speedval").textContent = speedMul + "×"; };
$("eqeditor").addEventListener("input", debounce(applyEquation, 300));
$("eqeditor").addEventListener("keydown", e => {
  if (e.key === "Tab") {
    e.preventDefault();
    const t = e.target, s = t.selectionStart;
    t.value = t.value.slice(0, s) + "  " + t.value.slice(t.selectionEnd);
    t.selectionStart = t.selectionEnd = s + 2;
  }
});  $("eqreset").onclick = () => {
    $("eqeditor").value = mode.defaultCode;
    applyEquation(); markPreset(null);
    saveStore(s => { if (s.eq) delete s.eq[mode.id]; if (s.p) delete s.p[mode.id]; });
    mode.P = {}; for (const pd of mode.params) mode.P[pd.key] = pd.value;
    mode.init(); buildParams(); workerRefresh();
  };
$("bins").oninput = () => { hist.dirty = true; };
["trails", "showTheory", "colorBySpeed"].forEach(id => $(id).onchange = () => { hist.dirty = true; });
["showReadouts"].forEach(id => $(id).onchange = () => updateReadouts());
["showSpark"].forEach(id => $(id).onchange = () => drawSpark());

function togglePause() {
  paused = !paused;
  $("btnPause").textContent = paused ? "▶ Resume" : "⏸ Pause";
  $("statusdot").style.background = paused ? "var(--orange)" : "var(--green)";
  setStatus(paused ? "paused" : "running");
}
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); $("btnDrop").click(); }
  else if (e.key === "p" || e.key === "P") togglePause();
  else if (e.key === "c" || e.key === "C") clearParticles();
  else if (e.key >= "1" && e.key <= "9") { const i = parseInt(e.key) - 1; if (i < MODES.length) switchMode(i); }
});

function debounce(fn, ms) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

// ---------- go -------------------------------------------------------------
resize();
switchMode(0);
loadShareHash();
requestAnimationFrame(frame);
</script>
