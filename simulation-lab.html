<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics Simulation Lab</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel2: #1c2330;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --orange: #d29922;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column;
  }
  /* ---------- Top bar ---------- */
  #topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px; background: var(--panel);
    border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  #topbar h1 { font-size: 15px; font-weight: 600; margin-right: 8px; white-space: nowrap; }
  #topbar h1 span { color: var(--accent); }
  .topbtn {
    padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
    border: 1px solid var(--border); background: var(--panel2); color: var(--text);
  }
  .topbtn.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; font-weight: 600; }
  .topbtn.primary:hover { background: #388bfd; }
  .topbtn:hover { border-color: var(--accent); }
  .topbtn:disabled { opacity: .45; cursor: default; }
  #speedwrap { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  #speedwrap input { width: 90px; accent-color: var(--accent); }
  #statusdot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); margin-left: auto; }
  #statustext { font-size: 12px; color: var(--muted); }
  /* ---------- Main layout ---------- */
  #main { flex: 1; display: flex; min-height: 0; }
  #sidebar {
    width: 340px; min-width: 280px; background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow-y: auto;
  }
  /* simulation menu */
  #menuSection { flex-shrink: 0; position: sticky; top: 0; z-index: 3; background: var(--panel); }
  #simSearch {
    width: 100%; padding: 6px 10px; font-size: 12.5px; color: var(--text);
    background: #0d1117; border: 1px solid var(--border); border-radius: 6px; outline: none;
  }
  #simSearch:focus { border-color: var(--accent); }
  #simSearch::placeholder { color: var(--muted); }
  #simMenu { max-height: 38vh; overflow-y: auto; margin-top: 8px; }
  .simcat {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); padding: 7px 4px 4px; cursor: pointer; user-select: none;
    display: flex; align-items: center; justify-content: space-between;
  }
  .simcat:hover { color: var(--text); }
  .simcat .caret { font-size: 9px; transition: transform .15s; }
  .simcat.closed .caret { transform: rotate(-90deg); }
  .simrow {
    display: flex; align-items: center; gap: 7px;
    padding: 5px 8px; margin: 1px 0; border-radius: 5px; cursor: pointer;
    font-size: 12.5px; color: var(--muted); border: 1px solid transparent;
  }
  .simrow:hover { color: var(--text); background: var(--panel2); }
  .simrow.active { color: var(--accent); background: var(--panel2); border-color: var(--border); font-weight: 600; }
  .simrow .key { margin-left: auto; font-size: 10px; color: var(--muted); font-family: ui-monospace, Consolas, monospace; }
  .simrow.active .key { color: var(--accent); }
  #simNone { font-size: 12px; color: var(--muted); padding: 8px 4px; text-align: center; }
  #stage { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #canvaswrap { flex: 1; position: relative; min-height: 0; background: #090c10; }
  canvas#sim { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hint {
    position: absolute; top: 10px; left: 12px; font-size: 11.5px; color: var(--muted);
    background: rgba(13,17,23,.75); padding: 4px 8px; border-radius: 4px; pointer-events: none;
  }
  /* ---------- Sidebar sections ---------- */
  .section { border-bottom: 1px solid var(--border); padding: 10px 14px; }
  .section h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
  }
  .section h2 .resetlink {
    font-size: 10px; color: var(--accent); cursor: pointer; text-transform: none; letter-spacing: 0;
  }
  #eqname { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--accent); margin-bottom: 6px; }
  #eqsig { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--muted); margin-bottom: 6px; line-height: 1.5; }
  #eqdesc { font-size: 11.5px; color: var(--muted); margin-bottom: 8px; line-height: 1.45; }
  #eqeditor {
    width: 100%; min-height: 84px; resize: vertical;
    background: #0d1117; color: #c9d1d9; border: 1px solid var(--border); border-radius: 6px;
    font-family: ui-monospace, Consolas, "Courier New", monospace; font-size: 12.5px; line-height: 1.5;
    padding: 8px; tab-size: 2;
  }
  #eqeditor:focus { outline: none; border-color: var(--accent); }
  #eqerr {
    display: none; margin-top: 8px; padding: 6px 9px; border-radius: 6px;
    background: rgba(248,81,73,.12); border: 1px solid rgba(248,81,73,.45);
    color: var(--red); font-family: ui-monospace, Consolas, monospace; font-size: 11px;
    white-space: pre-wrap; word-break: break-word; max-height: 90px; overflow-y: auto;
  }
  #eqok { display: none; margin-top: 8px; color: var(--green); font-size: 11px; }
  /* sliders */
  .param { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-size: 12px; }
  .param label { width: 120px; color: var(--muted); flex-shrink: 0; }
  .param input[type=range] { flex: 1; accent-color: var(--accent); }
  .param .val { width: 48px; text-align: right; font-family: ui-monospace, Consolas, monospace; color: var(--text); }
  .togglerow { display: flex; align-items: center; gap: 8px; font-size: 12.5px; margin-bottom: 6px; color: var(--text); }
  .togglerow input { accent-color: var(--accent); }
  /* presets */
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .preset {
    padding: 4px 10px; font-size: 11.5px; border-radius: 5px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel2); color: var(--muted);
  }
  .preset:hover { color: var(--text); border-color: var(--accent); }
  .preset.active { color: var(--accent); border-color: var(--accent); }
  /* ---------- Histogram strip ---------- */
  #histo {
    height: 190px; background: var(--panel); border-top: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  #histohead {
    display: flex; align-items: center; gap: 14px; padding: 5px 14px; font-size: 11.5px; color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  #histohead b { color: var(--text); font-size: 12px; font-weight: 600; }
  #histohead input[type=range] { width: 100px; accent-color: var(--accent); }
  #histostats { margin-left: auto; font-family: ui-monospace, Consolas, monospace; white-space: nowrap; }
  #histohead .topbtn { padding: 2px 8px; font-size: 11px; }
  #histocanvas { flex: 1; width: 100%; display: block; }
  /* keyboard help */
  #keys { font-size: 11px; color: var(--muted); line-height: 1.7; }
  #keys kbd {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 3px;
    padding: 0 5px; font-family: ui-monospace, monospace; font-size: 10px;
  }
  @media (max-width: 900px) { #sidebar { width: 260px; min-width: 220px; } }
  @media (max-width: 760px) {
    #topbar { gap: 6px; padding: 6px 10px; }
    #topbar h1 { font-size: 13px; margin-right: 2px; }
    .topbtn { padding: 5px 10px; font-size: 12px; }
    #speedwrap input { width: 64px; }
    #main { flex-direction: column; }
    #sidebar {
      width: 100%; min-width: 0; max-height: 42%;
      border-right: none; border-bottom: 1px solid var(--border);
    }
    #simMenu { max-height: 24vh; }
    #menuSection { position: static; }
    #canvaswrap { min-height: 180px; }
    #histo { height: 120px; }
    #eqeditor { min-height: 56px; }
    #eqdesc { display: none; }
    #hint { display: none; }
  }
</style>
</head>
<body>
  <div id="topbar">
    <h1>⚛ Physics <span>Sim</span> Lab</h1>
    <button class="topbtn primary" id="btnDrop">▶ Drop balls</button>
    <button class="topbtn" id="btnPause">⏸ Pause</button>
    <button class="topbtn" id="btnClear">✕ Clear</button>
    <div id="speedwrap">speed <input type="range" id="speed" min="0.25" max="4" step="0.25" value="1"><span id="speedval">1×</span></div>
    <div id="statusdot"></div><div id="statustext">ready</div>
  </div>

  <div id="main">
    <div id="sidebar">
      <div class="section" id="menuSection">
        <h2>Simulations <span class="resetlink" id="menuToggle">collapse all</span></h2>
        <input type="search" id="simSearch" placeholder="Search simulations…" spellcheck="false">
        <div id="simMenu"></div>
        <div id="simNone" style="display:none">no matching simulations</div>
      </div>
      <div class="section">
        <h2>Equation — edit me live <span class="resetlink" id="eqreset">reset</span></h2>
        <div id="eqname"></div>
        <div id="eqsig"></div>
        <div id="eqdesc"></div>
        <textarea id="eqeditor" spellcheck="false"></textarea>
        <div id="eqerr"></div>
        <div id="eqok">✓ compiled</div>
      </div>
      <div class="section">
        <h2>Parameters</h2>
        <div id="params"></div>
      </div>
      <div class="section" id="presetSection" style="display:none">
        <h2>Presets</h2>
        <div class="presets" id="presets"></div>
      </div>
      <div class="section">
        <h2>Display</h2>
        <div class="togglerow"><input type="checkbox" id="trails"><label for="trails">Motion trails</label></div>
        <div class="togglerow"><input type="checkbox" id="showTheory" checked><label for="showTheory">Theoretical curve overlay</label></div>
        <div class="togglerow"><input type="checkbox" id="colorBySpeed" checked><label for="colorBySpeed">Color particles by speed</label></div>
      </div>
      <div class="section">
        <h2>Shortcuts</h2>
        <div id="keys">
          <kbd>Space</kbd> drop balls &nbsp; <kbd>P</kbd> pause &nbsp; <kbd>C</kbd> clear &nbsp;          <kbd>1..9</kbd> quick-switch sim
        </div>
      </div>
    </div>

    <div id="stage">
      <div id="canvaswrap">
        <canvas id="sim"></canvas>
        <div id="hint"></div>
      </div>
      <div id="histo">
        <div id="histohead">
          <b id="histoLabel">Distribution of final X</b>
          <span>bins <input type="range" id="bins" min="8" max="80" step="2" value="40"></span>
          <button class="topbtn" id="btnCsv" title="Download histogram as CSV">⬇ CSV</button>
          <button class="topbtn" id="btnPng" title="Save canvas snapshot as PNG">⬇ PNG</button>
          <span id="histostats">n=0</span>
        </div>
        <canvas id="histocanvas"></canvas>
      </div>
    </div>
  </div>

<script>
"use strict";
/* =========================================================================
   Physics Simulation Lab — single file, zero dependencies.
   Twenty-seven simulations, each exposing ONE editable equation compiled live with
   new Function(). A shared engine handles particles, fixed-timestep
   integration, rendering, and the final-X histogram.
   ========================================================================= */

// ---------- helpers -------------------------------------------------------
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
// deterministic-ish but fast RNG for reproducible runs
let rngState = 123456789;
function rng() { rngState = (Math.imul(rngState, 1103515245) + 12345) & 0x7fffffff; return rngState / 0x7fffffff; }
function gauss() { // Box-Muller
  let u = 0, v = 0;
  while (u === 0) u = rng();
  while (v === 0) v = rng();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function speedColor(sp, maxSp) {
  const t = clamp(sp / (maxSp || 1), 0, 1);
  const h = 210 - 210 * t;            // blue → red
  return `hsl(${h}, 85%, ${55 + 10 * t}%)`;
}
// classic RK4 for a state vector, f(state) -> derivative
function rk4(s, h, f) {
  const k1 = f(s);
  const s2 = s.map((v, i) => v + h / 2 * k1[i]); const k2 = f(s2);
  const s3 = s.map((v, i) => v + h / 2 * k2[i]); const k3 = f(s3);
  const s4 = s.map((v, i) => v + h * k3[i]);  const k4 = f(s4);
  return s.map((v, i) => v + h / 6 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]));
}
// push a sample into the distribution histogram (bounded)
function pushSample(x) {
  if (!isFinite(x)) return;
  hist.xs.push(x);
  if (hist.xs.length > 40000) hist.xs.splice(0, hist.xs.length - 40000);
  hist.dirty = true;
}

// ---------- equation compiler --------------------------------------------
// Compiles user code into fn(...args) -> value. Returns {fn, err}.
function compileEq(code, argNames, bodyMustReturn) {
  try {
    const f = new Function(...argNames, `"use strict";\n${code}`);
    // smoke test with benign inputs; signatures that destructure arrays/objects
    // will throw on scalars, so a probe exception is not an error — runtime
    // problems are caught (and reported) per-step instead.
    try {
      const probe = argNames.map(() => 0.5);
      const out = f(...probe);
      if (bodyMustReturn && (out === undefined)) return { fn: null, err: "Equation returned undefined — add a `return` statement." };
    } catch (_) { /* probe incompatible with signature — fine */ }
    return { fn: f, err: null };
  } catch (e) { return { fn: null, err: e.message }; }
}

// ---------- canvas setup --------------------------------------------------
const canvas = $("sim"), ctx = canvas.getContext("2d");
const hcanvas = $("histocanvas"), hctx = hcanvas.getContext("2d");
let W = 100, H = 100;                       // css pixel size of sim canvas
let HW = 100, HH = 100;                     // histogram canvas
function resize() {
  const wrap = $("canvaswrap"), r = wrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  W = Math.max(50, r.width); H = Math.max(50, r.height);
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const hr = hcanvas.getBoundingClientRect();
  HW = Math.max(50, hr.width); HH = Math.max(50, hr.height);
  hcanvas.width = HW * dpr; hcanvas.height = HH * dpr;
  hctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (mode) { mode.layout(); mode.draw(); }
  drawHistogram();
}
window.addEventListener("resize", resize);

// ---------- particles ------------------------------------------------------
// Particle: {x,y,vx,vy, alive, data:{...mode-specific}}
let particles = [];
let mode = null;
let paused = false;
let speedMul = 1;
let simTime = 0;

// histogram of "landed" particles' final x
const hist = { xs: [], dirty: true };
function recordLanding(p) { hist.xs.push(p.x); hist.dirty = true; }
function clearLanding() { hist.xs = []; hist.dirty = true; }

// ---------- physics loop --------------------------------------------------
const DT = 1 / 120;                          // fixed physics timestep (s)
let accumulator = 0, lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const realDt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (paused) { mode.draw(); drawHistogram(); return; }
  accumulator += realDt * speedMul;
  let steps = 0;
  while (accumulator >= DT && steps < 600) {   // budget: never wedge the tab
    mode.step(DT);
    simTime += DT;
    accumulator -= DT;
    steps++;
  }
  if (steps >= 600) accumulator = 0;           // drop backlog if overloaded
  frameCount++;
  mode.draw();
  drawHistogram();
}

// ==========================================================================
//  GALTON BOARD
// ==========================================================================
const galton = {
  id: "galton",
  label: "Galton Board",
  category: "Statistical",
  hint: "Balls bounce off pegs — each row is a Bernoulli trial. With p=0.5 the bottom histogram converges to the normal distribution.",
  histLabel: "Landing position (binomial → normal)",
  eqName: "pDeflectRight(row, x, params)",
  eqSig: "row: 0..rows-1 · x: ball position (px) · returns: probability [0..1] of going right",
  eqDesc: "Default is a fair coin flip every row → binomial → normal. Make p depend on x (or row) to bias the distribution — the histogram updates live.",
  eqSpec: { argNames: ["row", "x", "params"], mustReturn: true },
  defaultCode:
`// probability that a ball deflects RIGHT at this peg
// row: 0..params.rows-1, x: horizontal position (px)
let p = 0.5;

// try me: bias toward the right edge
// p = 0.5 + 0.3 * row / params.rows;

// try me: wall-hugger (balls cling to sides)
// p = x < params.width/2 ? 0.75 : 0.25;

// try me: sinusoidal bias field
// p = 0.5 + 0.35 * Math.sin(x / 60);

return p;`,
  params: [
    { key: "rows",     label: "Peg rows",    min: 4,  max: 26,   step: 1,     value: 13 },
    { key: "rate",     label: "Balls/sec",   min: 2,  max: 120,  step: 1,     value: 30 },
    { key: "gap",      label: "Peg spacing", min: 18, max: 60,   step: 1,     value: 34 },
    { key: "rest",     label: "Bounciness",  min: 0.2, max: 1.2, step: 0.05,  value: 0.55 },
    { key: "width",    label: "Width (px)",  min: 300, max: 1600, step: 20,   value: 760 },
    { key: "jitter",   label: "Randomness",  min: 0,  max: 1,    step: 0.05,  value: 0.25 },
  ],
  P: {},
  pegs: [], // {x,y}
  spawnAcc: 0,
  binCounts: {},

  init() { this.rebuildPegs(); this.spawnAcc = 0; this.binCounts = {}; },
  rebuildPegs() {
    this.pegs = [];
    const rows = this.P.rows, gap = this.P.gap, cw = this.P.width;
    for (let r = 0; r < rows; r++) {
      const y = 60 + r * gap;
      const count = r + 3;
      for (let i = 0; i < count; i++) {
        // board coords are centered at x=0: pegs span [-half, half]
        this.pegs.push({ x: (i - (count - 1) / 2) * gap, y });
      }
    }
    this.floorY = 60 + rows * gap + gap * 0.9;
  },
  layout() { this.rebuildPegs(); },
  onParam(key) { if (key === "rows" || key === "gap" || key === "width") { clearParticles(); this.rebuildPegs(); this.binCounts = {}; } },

  queue: 0,

  drop(n) {
    this.queue += n;
    setStatus(`${this.queue} balls queued`);
  },

  step(dt) {
    // spawn from queue at the configured rate
    this.spawnAcc += this.P.rate * dt;
    while (this.spawnAcc >= 1 && this.queue > 0 && particles.length < 1500) {
      this.spawnAcc -= 1;
      this.queue--;
      particles.push({
        x: gauss() * 3, y: 20, vx: gauss() * 8, vy: 30,
        alive: true, r: 4.5, data: { row: -1, landed: false }
      });
    }
    if (this.spawnAcc > 1) this.spawnAcc = 1; // don't accumulate while queue empty
    const g = 900; // px/s²
    for (const p of particles) {
      if (!p.alive || p.data.landed) continue;
      p.vy += g * dt;
      // peg collisions — the Galton gate
      for (const peg of this.pegs) {
        const dx = p.x - peg.x, dy = p.y - peg.y;
        const rr = p.r + 5;
        if (dx * dx + dy * dy < rr * rr && p.vy > -20) {
          let pr;
          try { pr = this.eq(p.data.row + 1, peg.x, this.P); }
          catch (e) { eqRuntimeError(e); pr = 0.5; }
          if (!isFinite(pr)) pr = 0.5;
          pr = clamp(pr, 0, 1);
          const dir = rng() < pr ? 1 : -1;
          p.data.row++;
          // deflect: lateral kick proportional to peg gap → per-row spread ≈ gap/2,
          // so after N rows σ ≈ gap·√N/2 (matches binomial theory)
          const kick = this.P.gap * (1.1 + 0.9 * rng() * (0.5 + this.P.jitter));
          p.vx = dir * kick;
          p.vy = -Math.abs(p.vy) * 0.12 * this.P.rest - 20;
          // nudge out of the peg so we don't re-trigger every step
          const d = Math.hypot(dx, dy) || 1;
          p.x = peg.x + (dx / d) * rr * 1.05;
          p.y = peg.y + (dy / d) * rr * 1.05;
          break;
        }
      }
      p.x += p.vx * dt; p.y += p.vy * dt;
      // side walls (funnel)
      const half = this.P.width / 2;
      if (p.x < -half + 4) { p.x = -half + 4; p.vx = Math.abs(p.vx) * 0.4; }
      if (p.x >  half - 4) { p.x =  half - 4; p.vx = -Math.abs(p.vx) * 0.4; }
      // landed in bins
      if (p.y >= this.floorY && !p.data.landed) {
        p.data.landed = true;
        p.vy = 0; p.vx = 0;
        const bin = clamp(Math.floor((p.x + half) / this.P.gap), 0, 999);
        this.binCounts[bin] = (this.binCounts[bin] || 0) + 1;
        p.y = this.floorY - 4 - Math.min(this.binCounts[bin], 16) * 7;
        recordLanding(p);
      }
    }
  },

  draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    // auto-fit: scale the board to the visible canvas
    const fit = Math.min(W / (this.P.width + 60), H / (this.floorY + 110));
    ctx.translate(W / 2, 8);
    ctx.scale(fit, fit);
    const half = this.P.width / 2;
    // funnel walls
    ctx.strokeStyle = "#30363d"; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-half, 0); ctx.lineTo(-half, this.floorY + 40);
    ctx.moveTo(half, 0);  ctx.lineTo(half, this.floorY + 40);
    ctx.stroke();
    // pegs
    ctx.fillStyle = "#58a6ff";
    for (const peg of this.pegs) { ctx.beginPath(); ctx.arc(peg.x, peg.y, 3.2, 0, 7); ctx.fill(); }
    // floor + bins
    ctx.strokeStyle = "#8b949e"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-half, this.floorY); ctx.lineTo(half, this.floorY); ctx.stroke();
    // bin separators
    const bw = this.P.gap;
    ctx.strokeStyle = "#21262d"; ctx.lineWidth = 1.5;
    for (let x = -half; x <= half + 1; x += bw) {

            - m2 * g * Math.sin(t1 - 2 * t2)
            - 2 * Math.sin(dt) * m2 * (w2*w2 + w1*w1 * Math.cos(dt))) / den;

// try me — heavy damping kills chaos:

    const a1 = (-g * (2 + m2) * Math.sin(t1) - m2 * g * Math.sin(t1 - 2 * t2)
                - 2 * Math.sin(dt) * m2 * (w2 * w2 + w1 * w1 * Math.cos(dt))) / den;
    const a2 = (2 * Math.sin(dt) * (w1 * w1 * (1 + m2) + g * Math.cos(t1)

const G = params.G, eps2 = params.soft * params.soft;

// try me — planet-shattering repulsion:

  P: {}, bodies: [], trails: [], yr: 0,

  orbitVel(a, e, r, nuDeg) {

    const G = 4 * Math.PI * Math.PI;
    const v = Math.sqrt(G * (2 / r - 1 / a));      // vis-viva (M_sun = 1)

      const v = this.orbitVel(pl.a, pl.e, p.r, pl.nu);
      this.bodies.push({ x: p.x, y: p.y, vx: v.x, vy: v.y, m: pl.m, name: pl.name, e: pl.e, a: pl.a });

        for (let i = 0; i < this.bodies.length; i++) {

  eqSpec: { argNames: ["x", "y", "params"], mustReturn: true },
  params: [
    { key: "q1",    label: "Left charge q₁", min: -2,   max: 2,   step: 0.1, value: 1 },

  P: {}, lines: [],

  init() { this.buildLines(); },
  buildLines() {
    const P = this.P, hx = P.d / 2, cR = 14;
    const charges = [{ x: -hx, y: 0, q: P.q1 }, { x: hx, y: 0, q: P.q2 }];
    const pos = charges.filter(c => c.q > 0);
    this.lines = [];
    if (pos.length > 0) {
      const per = Math.max(1, Math.ceil(P.n / pos.length));
      for (const c of pos) {
        const nSeed = Math.min(per, P.n - this.lines.length);
        for (let i = 0; i < nSeed; i++) {
          const ang = (i + (rng() - 0.5) * 0.25) / per * Math.PI * 2;

      // no positive charge: field flows INTO the negative charges — seed from the screen edges
      for (let i = 0; i < P.n; i++) {

    if (P.q2 < 0) capt.push({ x: P.d / 2, y: 0 });

      const r = 14;
      ctx.fillStyle = q >= 0 ? "#f85149" : "#58a6ff";
      ctx.beginPath(); ctx.arc(x, 0, r, 0, 7); ctx.fill();
      ctx.fillStyle = "#0d1117"; ctx.font = "bold 15px ui-monospace, monospace";

const resonance = {
  id: "resonance", label: "Driven Oscillator",
  category: "Classical Dynamics",
  hint: "A damped mass-spring driven sinusoidally. When drive frequency f meets f₀ = √(k/m)/2π the amplitude blows up — resonance. Toggle the sweep and watch the bell curve form live.",
  histLabel: "Displacement samples (peak at f ≈ f₀)",
  eqName: "accel(y, vy, t, params)",
  eqSig: "y: displacement · vy: velocity · t: time (s) · returns: acceleration",
  eqDesc: "a = −k·y − c·vy + F·sin(2π·f·t). The auto-sweep glides f across f₀ so the amplitude swells and collapses in real time.",
  eqSpec: { argNames: ["y", "vy", "t", "params"], mustReturn: true },
  params: [
    { key: "k",     label: "Stiffness k",  min: 50,   max: 2000, step: 10,  value: 600 },
    { key: "c",     label: "Damping c",    min: 0,    max: 8,    step: 0.1, value: 3 },
    { key: "drv",   label: "Drive force F", min: 50,  max: 2000, step: 10,  value: 900 },
    { key: "f",     label: "Drive freq",   min: 0.3,  max: 8,    step: 0.05, value: 3.9 },
    { key: "sweep", label: "Auto-sweep",   min: 0,    max: 1,    step: 1,    value: 0 },
  ],
  defaultCode:
`// damped harmonic oscillator + sinusoidal drive
const om = 2 * Math.PI * params.f;
return -params.k * y - params.c * vy + params.drv * Math.sin(om * t);

// try me — cubic spring (the resonance peak bends over):
// return -params.k*y*(1 + 0.02*y*y) - params.c*vy + params.drv*Math.sin(om*t);

// try me — parametric pumping (Mathieu instability):
// return -params.k*(1 + 0.6*Math.sin(2*t))*y - params.c*vy;`,
  P: {}, y: 0.2, vy: 0, t: 0, amp: 0.2, pts: [],
  init() { this.y = 0.2; this.vy = 0; this.t = 0; this.amp = 0.2; this.pts = []; },
  layout() {},
  onParam(key) { if (key === "sweep") this.t = 0; },
  drop(n) { this.init(); setStatus("oscillator reset"); },

  step(dt) {
    const P = this.P;
    if (P.sweep) {
      const prd = 24, x = (this.t % prd) / prd;
      P.f = 0.4 + 3.8 * (x < 0.5 ? 2 * x : 2 - 2 * x);   // triangle sweep 0.4 → 4.2 Hz
    }
    try {
      const a = this.eq(this.y, this.vy, this.t, P);
      if (isFinite(a)) { this.vy += a * dt; this.y += this.vy * dt; }
    } catch (e) { eqRuntimeError(e); }
    if (!isFinite(this.y) || Math.abs(this.y) > 600) { this.y = 0; this.vy = 0; this.pts.length = 0; }
    this.t += dt;
    this.amp = Math.max(this.amp * 0.9996, Math.abs(this.y));
    this.pts.push(this.y, this.vy);
    if (this.pts.length > 900) this.pts.splice(0, 2);
    pushSample(this.y);
  },

  draw() {
    ctx.clearRect(0, 0, W, H);
    const P = this.P, f0 = Math.sqrt(P.k) / (2 * Math.PI);
    const midY = H * 0.55, sx = 60;
    const scale = Math.max(4, Math.min(120, H * 0.3 / Math.max(this.amp, 0.001)));
    const mY = midY - this.y * scale;
    // ceiling + spring
    ctx.fillStyle = "#8b949e"; ctx.fillRect(sx - 24, 4, 48, 4);
    ctx.strokeStyle = "#8b949e"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(sx, 8);
    const coils = 7, top = 8, bot = mY - 14;
    for (let i = 1; i <= coils * 2; i++) {
      const fr = i / (coils * 2);
      ctx.lineTo(sx + (i % 2 === 0 ? -9 : 9), top + (bot - top) * fr);
    }
    ctx.lineTo(sx, bot); ctx.stroke();
    // mass
    ctx.fillStyle = "#58a6ff"; ctx.fillRect(sx - 12, mY - 12, 24, 24);
    ctx.fillStyle = "#0d1117"; ctx.font = "10px ui-monospace, monospace";
    ctx.fillText("m", sx - 4, mY + 4);
    // equilibrium guide
    ctx.strokeStyle = "rgba(0,122,255,.25)"; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(sx - 44, midY); ctx.lineTo(sx + 44, midY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#8b949e"; ctx.font = "11px ui-monospace, monospace";
    ctx.fillText(`k=${P.k}  c=${P.c}  f=${P.sweep ? "sweep " : "=" + P.f.toFixed(2) + " Hz"}  f₀=${f0.toFixed(2)} Hz  A≈${this.amp.toFixed(0)}`, 12, 18);
    if (P.sweep) ctx.fillText(`sweeping…  f = ${P.f.toFixed(2)} Hz`, 12, 32);
    // phase-space portrait, bottom-right
    const pw = Math.min(170, W * 0.22), ph = Math.min(120, H * 0.26);
    const px0 = W - pw - 14, py0 = H - ph - 14;
    const vyScale = Math.max(40, Math.sqrt(P.k)) * 2;
    ctx.fillStyle = "rgba(13,17,23,.72)"; ctx.fillRect(px0 - 4, py0 - 4, pw + 8, ph + 8);
    ctx.strokeStyle = "#21262d"; ctx.lineWidth = 1;
    ctx.strokeRect(px0 - 4, py0 - 4, pw + 8, ph + 8);
    ctx.strokeStyle = "rgba(88,166,255,.75)"; ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let i = 0; i < this.pts.length - 3; i += 2) {
      const X = px0 + pw / 2 + (this.pts[i] / Math.max(this.amp, 0.01)) * pw * 0.45;
      const Y = py0 + ph / 2 - (this.pts[i + 1] / vyScale) * ph * 0.45;
      if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
    }
    ctx.stroke();
    ctx.fillStyle = "rgba(230,237,243,.6)"; ctx.font = "9px ui-monospace, monospace";
    ctx.fillText("phase space (y, vy)", px0, py0 - 7);
  },

  xRange() { const s = Math.max(1.2 * this.amp, 0.5); return [-s, s]; },
  presets: [
    { name: "At resonance (f=f₀)", params: { f: 3.9, sweep: 0 } },
    { name: "Off resonance", params: { f: 2.2, sweep: 0 } },
    { name: "Auto-sweep", params: { sweep: 1 } },
    { name: "Heavy damping", params: { c: 7, drv: 1500 } },
    { name: "Undamped (runaway)", params: { c: 0, drv: 900 } },

};

const life = {
  id: "life", label: "Game of Life",
  category: "Emergent Systems",
  hint: "A cellular automaton on a toroidal grid driven by one rule. Classic B3/S23 hatches gliders; HighLife (B36/S23) breeds self-replicating colonies.",
  histLabel: "Population alive per generation",
  eqName: "alive(alive, neighbors, params)",
  eqSig: "alive: 1/0 · neighbors: live neighbor count 0..8 · returns: 1 or 0",
  eqDesc: "Conway's rule — survive with 2–3 neighbours, be born with exactly 3. Tweak the numbers and entirely new species appear, some that never die out.",
  eqSpec: { argNames: ["alive", "neighbors", "params"], mustReturn: true },
  params: [
    { key: "cell",      label: "Cell size", min: 3,  max: 10, step: 1,    value: 6 },
    { key: "gps",       label: "Gen/sec",   min: 1,  max: 40, step: 1,    value: 8 },
    { key: "randomize", label: "Random %",  min: 0,  max: 1,  step: 0.01, value: 0.08 },
  ],
  defaultCode:
`// Conway's Game of Life — B3/S23
if (alive) return (neighbors === 2 || neighbors === 3) ? 1 : 0;
return neighbors === 3 ? 1 : 0;

// try me — HighLife (B36/S23) grows self-replicating machines:
// if (alive) return (neighbors === 2 || neighbors === 3) ? 1 : 0;
// return (neighbors === 3 || neighbors === 6) ? 1 : 0;`,
  P: {}, grid: null, nxt: null, gw: 0, gh: 0, img: null, cv: null, c2d: null,
  acc: 0, gen: 0, peak: 50, pop: 0,

  PATTERNS: {
    glider:     [[1, 0], [2, 1], [0, 2], [1, 2], [2, 2]],
    blinker:    [[1, 0], [1, 1], [1, 2]],
    toad:       [[1, 1], [1, 2], [1, 3], [2, 0], [2, 1], [2, 2]],
    beacon:     [[0, 0], [0, 1], [1, 0], [1, 1], [2, 2], [2, 3], [3, 2], [3, 3]],
    rpentomino: [[1, 0], [2, 0], [0, 1], [1, 1], [1, 2]],
  },

  setup() {
    this.gw = Math.max(8, Math.ceil(W / this.P.cell));
    this.gh = Math.max(8, Math.ceil(H / this.P.cell));
    this.grid = new Uint8Array(this.gw * this.gh);
    this.nxt = new Uint8Array(this.gw * this.gh);
    if (!this.cv) this.cv = document.createElement("canvas");
    this.cv.width = this.gw; this.cv.height = this.gh;
    this.c2d = this.cv.getContext("2d");
    this.img = this.c2d.createImageData(this.gw, this.gh);
    this.peak = Math.max(50, this.gw * this.gh * 0.2);
  },
  seedPattern(cx, cy, cells) {
    for (const [r, c] of cells) {
      const x = (cx + c + this.gw) % this.gw, y = (cy + r + this.gh) % this.gh;
      this.grid[y * this.gw + x] = 1;
    }
  },
  init() {
    this.setup();
    this.acc = 0; this.gen = 0; this.pop = 0;
    this.grid.fill(0); this.nxt.fill(0);
    if (this.P.randomize > 0.001) {
      for (let i = 0; i < this.grid.length; i++) if (rng() < this.P.randomize) this.grid[i] = 1;
    } else {
      const cx = Math.floor(this.gw / 2), cy = Math.floor(this.gh / 2);
      this.seedPattern(cx, cy, this.PATTERNS.glider);
      this.seedPattern(Math.floor(this.gw * 0.2), Math.floor(this.gh * 0.25), this.PATTERNS.blinker);
      this.seedPattern(Math.floor(this.gw * 0.78), Math.floor(this.gh * 0.72), this.PATTERNS.toad);
      this.seedPattern(Math.floor(this.gw * 0.8), Math.floor(this.gh * 0.24), this.PATTERNS.beacon);
      this.seedPattern(Math.floor(this.gw * 0.28), Math.floor(this.gh * 0.78), this.PATTERNS.rpentomino);
    }
    this.compose();
  },
  layout() { if (this.grid) this.init(); },
  onParam(key) { if (key === "cell") this.init(); },
  onPreset() { this.init(); },
  drop(n) { this.init(); setStatus("grid re-seeded"); },

  step(dt) {
    this.acc += this.P.gps * dt;
    let guard = 0;
    while (this.acc >= 1 && guard < 8) {
      this.acc -= 1; guard++;
      this.iterate();
    }
  },
  classic(alive, nb) { return alive ? (nb === 2 || nb === 3) : nb === 3; },

  iterate() {
    const g = this.grid, n = this.nxt, gw = this.gw, gh = this.gh;
    for (let y = 0; y < gh; y++) {
      const yU = (y + gh - 1) % gh, yD = (y + 1) % gh;
      for (let x = 0; x < gw; x++) {
        const i = y * gw + x;
        const xL = (x + gw - 1) % gw, xR = (x + 1) % gw;
        const nb = g[yU * gw + xL] + g[yU * gw + x] + g[yU * gw + xR]
                 + g[y * gw + xL] + g[y * gw + xR]
                 + g[yD * gw + xL] + g[yD * gw + x] + g[yD * gw + xR];
        let out;
        try { out = this.eq(g[i], nb, this.P); }
        catch (e) { eqRuntimeError(e); out = this.classic(g[i], nb) ? 1 : 0; }
        n[i] = out ? 1 : 0;
      }
    }
    const t = g; this.grid = n; this.nxt = t;
    this.pop = 0;
    for (const v of this.grid) this.pop += v;
    if (this.pop > this.peak) this.peak = this.pop;
    this.gen++;
    pushSample(this.pop);
    this.compose();
  },

  compose() {
    const a = this.img.data, g = this.grid;
    for (let i = 0; i < g.length; i++) {
      const o = i * 4;
      if (g[i]) { a[o] = 88; a[o + 1] = 166; a[o + 2] = 255; a[o + 3] = 255; }
      else { a[o] = 0; a[o + 1] = 0; a[o + 2] = 0; a[o + 3] = 0; }
    }
    this.c2d.putImageData(this.img, 0, 0);
  },

  draw() {
    ctx.clearRect(0, 0, W, H);
    if (this.cv) ctx.drawImage(this.cv, 0, 0, W, H);
    ctx.fillStyle = "#8b949e"; ctx.font = "11px ui-monospace, monospace";
    ctx.fillText(`generation ${this.gen}  ·  population ${this.pop}`, 12, 18);
  },

  xRange() { return [0, Math.max(50, this.peak * 1.15)]; },
  presets: [
    { name: "Classic B3/S23", params: { randomize: 0 } },
    { name: "HighLife (B36/S23)", code:
`// HighLife — B36/S23: born with 3 OR 6 neighbours → replicators
if (alive) return (neighbors === 2 || neighbors === 3) ? 1 : 0;
return (neighbors === 3 || neighbors === 6) ? 1 : 0;`, params: { randomize: 0 } },
    { name: "Starfield", params: { randomize: 0.09 } },
  ],
};

  histLabel: "Order parameter R (0 = chaos, 1 = unison)",
  eqName: "rate(omega, phase, psi, params)",
  eqSig: "omega: natural frequency · phase: current phase · psi: mean-field phase · returns: dφ/dt",
  eqDesc: "dφᵢ/dt = ωᵢ + K·R·sin(ψ − φᵢ). Everyone talks to everyone through the mean field. Wider ω-spread needs stronger K to lock in.",

  defaultCode:
`// phase velocity = natural frequency + pull toward the mean field
return omega + params.K * params.R * Math.sin(psi - phase);

// try me — fishbowl fugue (only your direct blinker matters):

// try me — some fireflies are antisocial and repel:
// return omega + params.K * params.R * Math.sin(psi - phase) * (Math.sin(3 * phase) > 0 ? 1 : -1);`,
  P: {}, os: [], R: 0, psi: 0,
  init() {
    this.os = [];
    for (let i = 0; i < this.P.n; i++) this.os.push({ w: this.P.mean + gauss() * this.P.spread, phi: rng() * Math.PI * 2 });
    this.R = 0; this.psi = 0;
  },
  layout() {},
  onParam(key) {

      while (this.os.length < this.P.n) this.os.push({ w: this.P.mean + gauss() * this.P.spread, phi: rng() * Math.PI * 2 });

  step(dt) {
    const P = this.P, f = this.eq, os = this.os, N = os.length || 1;
    let sx = 0, sy = 0;
    for (const o of os) { sx += Math.cos(o.phi); sy += Math.sin(o.phi); }
    sx /= N; sy /= N;
    this.R = Math.hypot(sx, sy);
    this.psi = Math.atan2(sy, sx);

      let d;
      try { d = f(o.w, o.phi, this.psi, P); } catch (e) { eqRuntimeError(e); d = o.w; }

  },

  presets: [

// ==========================================================================

const milkyway = {
  id: "milkyway", label: "Milky Way",
  category: "Celestial Mechanics",

  histLabel: "Star radius r (kpc)",
  eqName: "accel(x, y, params)",
  eqSig: "x,y: star position (kpc, galaxy center at 0,0) · returns: {x,y} gravitational acceleration (kpc/Myr²)",
  eqDesc: "Spherically-symmetric gravity: a Keplerian bulge (accel ∝ GM/r²) plus a dark halo whose logarithmic potential gives the flat outer rotation curve V ≈ haloV. Edit the force law and the entire disk re-orients its orbits to follow it.",
  eqSpec: { argNames: ["x", "y", "params"], mustReturn: true },
  params: [
    { key: "bulge", label: "Bulge GM",   min: 0,     max: 8,    step: 0.2, value: 1.2 },
    { key: "vh",    label: "Halo speed", min: 0,     max: 4,    step: 0.1, value: 1 },
    { key: "rc",    label: "Halo core",  min: 0.1,   max: 3,    step: 0.1, value: 0.6 },
    { key: "n",     label: "Stars",      min: 500,   max: 4000, step: 250, value: 2000 },
    { key: "warp",  label: "Time warp",  min: 0.2,   max: 4,    step: 0.2, value: 1.5 },
  ],
  defaultCode:
`// total inward acceleration at radius r from:
//   central bulge (point mass):   GM / r²
//   dark halo (log potential):    Vh²·r / (r² + rc²)
const r = Math.hypot(x, y) + 1e-3;
const ar = -(params.bulge / (r * r)) - (params.vh * params.vh * r / (r * r + params.rc * params.rc));
return { x: ar * (x / r), y: ar * (y / r) };

// try me — no halo: the outer disk shears apart and stars spiral/escape
// return { x: -params.bulge * x / (r * r * r), y: -params.bulge * y / (r * r * r) };`,
  P: {}, stars: [],

  // circular-orbit speed for the default analytic rotation curve
  circSpeed(r) {
    const P = this.P;
    const ar = -(P.bulge / (r * r)) - (P.vh * P.vh * r / (r * r + P.rc * P.rc));
    return ar < 0 ? Math.sqrt(-ar * r) : 0;
  },

  init() {
    const N = this.P.n ?? 2000, Rmax = 10;
    this.stars = [];
    for (let i = 0; i < N; i++) {
      let r, bulge = false;
      if (rng() < 0.12) { r = 0.6 * Math.abs(gauss()); bulge = true; }
      else r = Rmax * (1 - Math.exp(-4 * rng()));
      r = Math.max(0.15, r);
      const arm = rng() < 0.74;
      let th = rng() * Math.PI * 2;
      if (arm) {
        const phi = 0.9 * Math.log(r + 0.5) + (i % 2) * Math.PI;
        th = phi + (rng() - 0.5) * 0.5;
      }
      const x = r * Math.cos(th), y = r * Math.sin(th);
      const V = this.circSpeed(r);
      this.stars.push({
        x, y,
        vx: -V * Math.sin(th), vy: V * Math.cos(th),
        r, arm, bulge,
        col: `hsl(${bulge ? 210 : (arm ? 205 : 215)}, ${bulge ? 55 : 82}%, ${55 + Math.floor(rng() * 25)}%)`,
      });

  },
  layout() {},
  onParam(key) { if (["n", "bulge", "vh", "rc"].includes(key)) this.init(); },
  onPreset() { this.init(); },
  drop(n) { this.init(); setStatus("galactic disk rebuilt"); },

  step(dt) {
    const P = this.P, f = this.eq, NS = 3, h = dt * P.warp / NS;
    for (const s of this.stars) {
      try {
        for (let k = 0; k < NS; k++) {
          let a = f(s.x, s.y, P);
          const ax = a && isFinite(a.x) && isFinite(a.y) ? a.x : 0;
          const ay = a && isFinite(a.x) && isFinite(a.y) ? a.y : 0;
          s.vx += ax * h * 0.5; s.vy += ay * h * 0.5;
          s.x += s.vx * h; s.y += s.vy * h;
          a = f(s.x, s.y, P);
          s.vx += (a && isFinite(a.x) && isFinite(a.y) ? a.x : 0) * h * 0.5;
          s.vy += (a && isFinite(a.x) && isFinite(a.y) ? a.y : 0) * h * 0.5;
          if (!isFinite(s.x) || s.x * s.x + s.y * s.y > 9e4) { this.init(); return; }
        }
        s.r = Math.hypot(s.x, s.y);
      } catch (e) { eqRuntimeError(e); return; }

  draw() {

// ==========================================================================
//  DOPPLER EFFECT (moving source, retarded time)
// ==========================================================================
const doppler = {
  id: "doppler", label: "Doppler Effect",
  category: "Waves",
  hint: "A source races across the screen emitting circular wavefronts (computed from retarded time). Ahead of it crests bunch up — short wavelength, high pitch; behind they stretch. Crank the speed toward the wave speed and a Mach-like cone forms.",
  histLabel: "Received frequency at observers ahead/behind (two spikes)",
  eqName: "field(x, y, tau, R, params)",
  eqSig: "x,y: field point (px, origin where the source starts) · tau: retarded emission time · R: distance from that emission point · returns: amplitude",
  eqDesc: "Retarded-time solution for a source moving along +x: the field at (x,y,t) was emitted earlier at τ solving |(x,y) − (v·τ,0)| = c(t−τ). Edit the waveform to change the source signature; the bunching ahead (Doppler) comes free from the geometry.",
  eqSpec: { argNames: ["x", "y", "tau", "R", "params"], mustReturn: true },
  params: [
    { key: "vs", label: "Source speed vs", min: 0,    max: 1.4, step: 0.05, value: 1.2 },   // in units of c
    { key: "f",  label: "Frequency",       min: 0.5,  max: 6,   step: 0.1,  value: 2.5 },
    { key: "A",  label: "Amplitude",       min: 0.2,  max: 2,   step: 0.1,  value: 1 },
    { key: "c",  label: "Wave speed c",    min: 20,   max: 200, step: 5,    value: 120 },
  ],
  defaultCode:
`// the source's waveform at retarded time tau and distance R
return params.A * Math.sin(2 * Math.PI * params.f * tau) / Math.sqrt(R / 20 + 1);

// try me — a single Gaussian pulse (click) instead of a tone:
// return params.A * Math.exp(-Math.pow((tau * params.f * 2), 2)) / Math.sqrt(R / 20 + 1);`,
  P: {}, tSim: 0, h: 0, off: null, octx: null, img: null, bufW: 0, bufH: 0,

  init() { this.tSim = 0; this.h = 1 / 120; this.off = document.createElement("canvas"); this.octx = null; },
  layout() { this.init(); },
  onParam() {},
  onPreset() {},
  drop(n) { setStatus("doppler source running"); },

  // retarded-time solve for source at position (v·τ, 0)
  ret(X, Y, t, P) {
    const c = P.c, v = P.vs * P.c;
    const A = c * c - v * v;
    const B = 2 * (X * v - c * c * t);
    const C = c * c * t * t - (X * X + Y * Y);
    if (Math.abs(A) < 1e-3) return null;
    const disc = B * B - 4 * A * C;
    if (disc < 0) return null;
    const tau = (-B - Math.sqrt(disc)) / (2 * A);
    if (tau > t + 1e-6 || tau < -1) return null;
    return { tau, R: Math.max(1e-3, c * (t - tau)) };
  },
  fieldVal(X, Y, t, P) {
    const s = this.ret(X, Y, t, P);
    if (!s) return 0;
    try { const v = this.eq(X, Y, s.tau, s.R, P); return isFinite(v) ? v : 0; } catch (e) { return 0; }
  },

  // received frequency at a fixed observer, from retarded-time geometry:
  // f_obs = f / (1 - (v/c) cosθ), cosθ = component of source velocity toward observer
  recvFreq(Xo) {
    const P = this.P, f = P.f, t = Math.max(this.tSim, 1e-6);
    const s = this.ret(Xo, 0, t, P);
    if (!s) return f;
    const v = P.vs * P.c;
    const cosTheta = (Xo - v * s.tau) / s.R;
    const denom = 1 - P.vs * cosTheta;
    if (!isFinite(denom) || Math.abs(denom) < 1e-3) return f * 4;
    return Math.max(1e-3, f / denom);
  },

  step(dt) {
    this.h = dt;
    this.tSim += dt;
    if (frameCount % 6 === 0) {
      const Xo = Math.min(140, (Math.min(W, H)) * 0.22);
      pushSample(this.recvFreq(Xo));     // ahead observer: higher pitch
      pushSample(this.recvFreq(-Xo));    // behind observer: lower pitch
    }
  },

  renderField() {
    const scale = 7;
    const bw = Math.ceil(W / scale), bh = Math.ceil(H / scale);
    if (bw !== this.bufW || bh !== this.bufH || !this.octx) {
      this.bufW = bw; this.bufH = bh;
      this.off.width = bw; this.off.height = bh;
      this.octx = this.off.getContext("2d");
      this.img = this.octx.createImageData(bw, bh);
    }
    const d = this.img.data, P = this.P, t = this.tSim;
    let k = 0;
    for (let py = 0; py < bh; py++) {
      const wy = H / 2 - py * scale;
      for (let px = 0; px < bw; px++) {
        const wx = px * scale - W / 2;
        let v = this.fieldVal(wx, wy, t, P);
        v = clamp(v, -1, 1);
        if (v > 0) { d[k] = 90 + 165 * v; d[k + 1] = 135 + 110 * v; d[k + 2] = 220; }
        else { d[k] = 20; d[k + 1] = 60 + 80 * -v; d[k + 2] = 160 + 95 * -v; }
        d[k + 3] = 255; k += 4;
      }
    }
    this.octx.putImageData(this.img, 0, 0);
  },

  draw() {
    ctx.clearRect(0, 0, W, H);
    try { this.renderField(); } catch (e) { eqRuntimeError(e); }
    if (this.octx) { ctx.imageSmoothingEnabled = true; ctx.drawImage(this.off, 0, 0, W, H); }
    // source dot (moves along +x)
    const sx = W / 2 + this.P.vs * this.P.c * this.tSim;
    ctx.fillStyle = "#f85149";
    ctx.beginPath(); ctx.arc(sx, H / 2, 6, 0, 7); ctx.fill();
    // observers
    const Xo = Math.min(140, Math.min(W, H) * 0.22);
    for (const os of [-1, 1]) {
      ctx.fillStyle = "#3fb950";
      ctx.beginPath(); ctx.arc(W / 2 + os * Xo, H / 2, 4, 0, 7); ctx.fill();
    }
    ctx.fillStyle = "#8b949e"; ctx.font = "11px ui-monospace, monospace";
    ctx.fillText(`source speed ${this.P.vs.toFixed(2)}·c   ahead ↑ pitch, behind ↓ pitch (histogram shows both)`, 12, 18);
  },

  xRange() { return [0, 5]; },
  presets: [
    { name: "Slow source vs=0.3", params: { vs: 0.3 } },
    { name: "Fast subsonic vs=0.8", params: { vs: 0.8 } },
    { name: "Approaching Mach vs=1.3", params: { vs: 1.3 } },
    { name: "Pulse (click)", params: { vs: 0.9 } },
  ],

    const P = this.P;
    this.amps = this.ks.map(k => Math.exp(-0.5 * Math.pow((k - P.k0) / Math.max(P.sk, 1e-4), 2)));
    try { this.om = this.ks.map(k => { const w = this.eq(k, P); return isFinite(w) ? w : 0; }); } catch (e) { eqRuntimeError(e); this.om = this.ks.map(() => 0); }
  },

  step(dt) {
    this.t += dt * (this.P.warp || 1);
    if (frameCount % 30 === 0) this.refreshOm();
    pushSample(0.001);
  },

  draw() {
    ctx.clearRect(0, 0, W, H);
    this.refreshOm();
    const P = this.P, mid = H * 0.5;
    const N = this.NX, x0 = W * 0.12, x1 = W - W * 0.12;
    const span = x1 - x0;
    // sample the superposition
    const Y = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      const x = x0 + i / (N - 1) * span;
      let v = 0;
      for (let m = 0; m < this.ks.length; m++) v += this.amps[m] * Math.sin(this.ks[m] * (x - W * 0.45) - this.om[m] * this.t);
      Y[i] = v;
    }
    let Amax = 0; for (let i = 0; i < N; i++) { const a = Math.abs(Y[i]); if (a > Amax) Amax = a; }
    const sc = Amax > 0.01 ? (H * 0.34) / Amax : 1;
    // envelope via local RMS
    const env = new Float32Array(N);
    const win = Math.max(2, Math.floor(N * 0.02));
    for (let i = 0; i < N; i++) {
      let s = 0, c = 0;
      for (let j = -win; j <= win; j++) { const ix = i + j; if (ix < 0 || ix >= N) continue; s += Y[ix] * Y[ix]; c++; }
      env[i] = Math.sqrt(s / Math.max(c, 1));
    }
    // energy-envelope band (moves at group velocity)
    ctx.fillStyle = "rgba(63,185,80,.16)";
    ctx.beginPath();
    for (let i = 0; i < N; i++) { const X = x0 + i / (N - 1) * span; if (i === 0) ctx.moveTo(X, mid - env[i] * sc); else ctx.lineTo(X, mid - env[i] * sc); }
    for (let i = N - 1; i >= 0; i--) { const X = x0 + i / (N - 1) * span; ctx.lineTo(X, mid + env[i] * sc); }
    ctx.closePath(); ctx.fill();
    // carrier wave
    ctx.strokeStyle = "#58a6ff"; ctx.lineWidth = 1.6; ctx.beginPath();
    for (let i = 0; i < N; i++) { const X = x0 + i / (N - 1) * span, YY = mid - Y[i] * sc; if (i === 0) ctx.moveTo(X, YY); else ctx.lineTo(X, YY); }
    ctx.stroke();
    // group / phase velocities
    const k0 = P.k0, dk = Math.max(P.sk, 1e-4);
    const om = this.om, K = this.ks;
    const w0 = this._omAt(k0), wa = this._omAt(k0 + dk), wb = this._omAt(k0 - dk);
    const vg = (wa - wb) / (2 * dk), vp = w0 / Math.max(k0, 1e-4);
    ctx.fillStyle = "#8b949e"; ctx.font = "11px ui-monospace, monospace";
    ctx.fillText(`group vg = dω/dk = ${vg.toFixed(1)}   phase vp = ω/k = ${vp.toFixed(1)} px/s  ·  blue carrier, green energy`, 12, 18);
  },
  _omAt(k) {
    const K = this.ks, O = this.om;
    for (let i = 0; i < K.length - 1; i++) if (k >= K[i] && k <= K[i + 1]) {
      const fr = (k - K[i]) / (K[i + 1] - K[i]);
      return O[i] + (O[i + 1] - O[i]) * fr;
    }
    return O[0];
  },

  xRange() { return [-0.1, 0.1]; },
  presets: [
    { name: "Linear (no spreading)", params: { b: 0, vp: 1.2 } },
    { name: "Mild dispersion", params: { b: 0.6, vp: 1.2 } },
    { name: "Deep-water", params: { b: 0, vp: 0.01, sk: 0.03 } },
    { name: "Narrow (long pulse)", params: { sk: 0.008, b: 1 } },
  ],
};

//  KDV SOLITONS (nonlinear wave equation)
// ==========================================================================
const soliton = {
  id: "soliton", label: "KdV Solitons",
  category: "Waves",
  hint: "The Korteweg–de Vries equation puts nonlinear steepening against dispersion to create solitons — waves that hold their shape and pass cleanly through one another. Watch a tall (fast) soliton overtake and swap past a short one.",
  histLabel: "Peak wave height u",
  eqName: "evolve(u, ux, uxxx, params)",
  eqSig: "u: local height · ux: spatial slope · uxxx: 3rd derivative · returns: du/dt (the KdV right-hand side)",
  eqDesc: "u_t = −nl·u·u_x − disp·u_xxx. The u·u_x term makes taller waves outrun shorter ones and steepens them; u_xxx spreads them. Only in balance do stable, colliding solitons form. Spectral derivatives keep it well-behaved.",
  eqSpec: { argNames: ["u", "ux", "uxxx", "params"], mustReturn: true },
  params: [
    { key: "nl",   label: "Nonlinear coeff", min: 0.05, max: 2,     step: 0.05,  value: 0.45 },
    { key: "disp", label: "Dispersion coeff", min: 0.005, max: 0.2, step: 0.005, value: 0.05 },
    { key: "warp", label: "Time scale",       min: 0.3,   max: 3,     step: 0.1,   value: 1 },
    { key: "n",    label: "Grid points",      min: 128,   max: 512,   step: 32,    value: 256 },
  ],
  defaultCode:
`// KdV right-hand side: nonlinear advection − dispersion
return -params.nl * u * ux - params.disp * uxxx;

// try me — nonlinearity alone: the wave steepens into a shock and breaks
// return -params.nl * u * ux;

// try me — dispersion alone: ripples just radiate away
// return -params.disp * uxxx;`,
  P: {}, u: null, t: 0,

  init() {
    const N = this.P.n || 256, L = this.L || 4 * Math.PI;
    this.u = new Float64Array(N);
    for (let i = 0; i < N; i++) {
      const x = i / N * L - L / 2;
      this.u[i] = this.sech2(x + 1.75, 6) + this.sech2(x - 1.75, this.P.s2a || 1.5);
    }
    this._re = new Float64Array(N); this._im = new Float64Array(N);
    this._uxR = new Float64Array(N); this._uxI = new Float64Array(N);
    this._u3R = new Float64Array(N); this._u3I = new Float64Array(N);
    this.t = 0;
  },
  sech2(x, amp) { const a = Math.sqrt(amp * 3 / 4); return amp / Math.pow(Math.cosh(a * x), 2); },
  layout() {},
  onParam() { this.init(); },
  onPreset() { this.init(); },
  drop(n) { this.init(); setStatus("soliton field reset"); },

  // spectral derivatives via FFT (stable for KdV's u_xxx), periodic BC
  derivs(u) {
    const N = u.length, L = this.L || 4 * Math.PI;
    const re = this._re, im = this._im;
    for (let i = 0; i < N; i++) { re[i] = u[i]; im[i] = 0; }
    this._fft(re, im, false);
    const uxR = this._uxR, uxI = this._uxI, u3R = this._u3R, u3I = this._u3I;
    const cut = N / 3;   // 2/3 dealiasing: drop the top third of wavenumbers (keeps u_xxx non-stiff for RK4)
    for (let i = 0; i < N; i++) {
      const k = i <= N / 2 ? i : i - N;
      if (Math.abs(k) > cut) { uxR[i] = 0; uxI[i] = 0; u3R[i] = 0; u3I[i] = 0; continue; }
      const kk = k * (2 * Math.PI / L), k3 = kk * kk * kk;
      const wr = re[i], wi = im[i];
      uxR[i] = -kk * wi; uxI[i] = kk * wr;     // (i k) F
      u3R[i] = k3 * wi;  u3I[i] = -k3 * wr;    // (i k)^3 F
    }
    for (let i = 0; i < N; i++) { re[i] = uxR[i]; im[i] = uxI[i]; }
    this._fft(re, im, true);
    const ux = new Float64Array(N);
    for (let i = 0; i < N; i++) ux[i] = re[i];
    for (let i = 0; i < N; i++) { re[i] = u3R[i]; im[i] = u3I[i]; }
    this._fft(re, im, true);
    const uxxx = new Float64Array(N);
    for (let i = 0; i < N; i++) uxxx[i] = re[i];
    return { ux, uxxx };
  },
  // iterative in-place radix-2 complex FFT
  _fft(re, im, inv) {
    const N = re.length;
    for (let i = 1, j = 0; i < N; i++) {
      let bit = N >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit;
      if (i < j) { const tr = re[i]; re[i] = re[j]; re[j] = tr; const ti = im[i]; im[i] = im[j]; im[j] = ti; }
    }
    for (let len = 2; len <= N; len <<= 1) {
      const ang = (inv ? 2 : -2) * Math.PI / len;
      const wR = Math.cos(ang), wI = Math.sin(ang);
      for (let i = 0; i < N; i += len) {
        let cR = 1, cI = 0;
        for (let k = 0; k < len / 2; k++) {
          const uR = re[i + k], uI = im[i + k];
          const vR = re[i + k + len / 2] * cR - im[i + k + len / 2] * cI;
          const vI = re[i + k + len / 2] * cI + im[i + k + len / 2] * cR;
          re[i + k] = uR + vR; im[i + k] = uI + vI;
          re[i + k + len / 2] = uR - vR; im[i + k + len / 2] = uI - vI;
          const nR = cR * wR - cI * wI; cI = cR * wI + cI * wR; cR = nR;
        }
      }
    }
    if (inv) for (let i = 0; i < N; i++) { re[i] /= N; im[i] /= N; }
  },

  // 2/3 dealiasing filter on the field (KdV's nonlinear product aliases, so filter each substep)
  _dealias() {
    const N = this.u.length, cut = N / 3;
    for (let i = 0; i < N; i++) { this._re[i] = this.u[i]; this._im[i] = 0; }
    this._fft(this._re, this._im, false);
    for (let i = 0; i < N; i++) {
      const k = i <= N / 2 ? i : i - N;
      if (Math.abs(k) > cut) { this._re[i] = 0; this._im[i] = 0; }
    }
    this._fft(this._re, this._im, true);
    for (let i = 0; i < N; i++) this.u[i] = this._re[i];
  },

  step(dt) {
    const P = this.P, f = this.eq, N = this.u.length;
    const dxx = this;
    const RHS = u => {
      const { ux, uxxx } = dxx.derivs(u);
      const rh = new Float64Array(N);
      for (let i = 0; i < N; i++) {
        let v = f(u[i], ux[i], uxxx[i], P);
        if (!isFinite(v)) v = 0;
        rh[i] = v;
      }
      return rh;
    };
    try {
      // numerical stability of pure u_xxx needs a small step: subdivide
      const NS = Math.max(2, Math.min(16, Math.ceil((dt * P.warp) / 0.002)));
      const h = dt * P.warp / NS;
      for (let s = 0; s < NS; s++) {
        const u0 = this.u;
        const k1 = RHS(u0);
        const k2s = new Float64Array(N); for (let i = 0; i < N; i++) k2s[i] = u0[i] + h / 2 * k1[i];
        const k2 = RHS(k2s);
        const k3s = new Float64Array(N); for (let i = 0; i < N; i++) k3s[i] = u0[i] + h / 2 * k2[i];
        const k3 = RHS(k3s);
        const k4s = new Float64Array(N); for (let i = 0; i < N; i++) k4s[i] = u0[i] + h * k3[i];
        const k4 = RHS(k4s);
        let bad = false;
        for (let i = 0; i < N; i++) {
          const v = u0[i] + h / 6 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]);
          if (!isFinite(v) || Math.abs(v) > 60) { bad = true; break; }
          this.u[i] = v;
        }
        if (bad) { this.init(); return; }
        this._dealias();
        this.t += h;
      }
    } catch (e) { eqRuntimeError(e); return; }
    let peak = 0;
    for (let i = 0; i < N; i++) if (this.u[i] > peak) peak = this.u[i];
    pushSample(peak);
  },

  draw() {
    ctx.clearRect(0, 0, W, H);
    const N = this.u.length, pad = 46, mid = H * 0.5;
    const xs = i => pad + i / (N - 1) * (W - 2 * pad);
    let maxu = 0; for (let i = 0; i < N; i++) maxu = Math.max(maxu, this.u[i]);
    const scl = Math.max(1.5, Math.min(60, H * 0.3 / Math.max(maxu, 0.001)));
    ctx.strokeStyle = "#30363d"; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(pad, mid); ctx.lineTo(W - pad, mid); ctx.stroke();
    ctx.strokeStyle = "#58a6ff"; ctx.lineWidth = 2.2; ctx.beginPath();
    for (let i = 0; i < N; i++) { const X = xs(i), Y = mid - this.u[i] * scl; if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y); }
    ctx.stroke();
    ctx.fillStyle = "#8b949e"; ctx.font = "11px ui-monospace, monospace";
    ctx.fillText(`KdV: u_t = −${this.P.nl.toFixed(1)}·u·u_x − ${this.P.disp.toFixed(3)}·u_xxx   ·   tall soliton rides fast & passes the short one`, 12, 18);
  },

  xRange() { return [0, 10]; },
  presets: [
    { name: "Two solitons collide", params: { nl: 0.45, disp: 0.05 } },
    { name: "Nonlinear only (breaker)", params: { disp: 0.005, nl: 0.45 } },
    { name: "Dispersion only (ripples)", params: { nl: 0.05, disp: 0.05 } },
    { name: "Slow-motion overtake", params: { nl: 0.9, disp: 0.1, warp: 0.5 } },
  ],
};

const timbre = {

  histLabel: "Instantaneous displacement (waveform PDF)",

  eqSpec: { argNames: ["n", "params"], mustReturn: true },

  defaultCode:
`// tone family by style: 0=sawtooth 1=mellow string 2=square 3=flute

if (s === 1) return (n % 2 === 1) ? 1 / (n * n) : 0;
if (s === 2) return (n % 2 === 1) ? 1 / n : 0;

return 1 / n;

// try me — a bright ringing tone with a strong 5th harmonic:

  P: {}, amps: [], t: 0, buf: [], A: 0,

  init() { this.t = 0; this.buf = []; this.amps = []; },
  layout() {},
  onParam() { this.init(); },

  refreshAmps() {
    const N = this.P.nm || 32, P = this.P;

    for (let n = 1; n <= N; n++) {
      let v;

  wave(t) {

  },

    ctx.strokeStyle = "#58a6ff"; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i < NX; i++) { const X = wx0 + i / (NX - 1) * (wx1 - wx0), YY = mid2 - Y[i] * sc; if (i === 0) ctx.moveTo(X, YY); else ctx.lineTo(X, YY); }
    ctx.stroke();

    const fam = ["sawtooth", "mellow string", "square", "flute"];
    ctx.fillStyle = "#8b949e"; ctx.font = "11px ui-monospace, monospace";
    ctx.fillText(`tone: ${fam[Math.round(P.style)] || "custom"}   f₀ = ${P.f0.toFixed(1)} Hz`, 12, 18);
    this.A = Amax;
  },

  xRange() { const s = Math.max(this.A, 0.5); return [-s * 1.2, s * 1.2]; },
  presets: [
    { name: "Sawtooth (brass)", params: { style: 0, f0: 4 } },
    { name: "Mellow string", params: { style: 1, f0: 5 } },
    { name: "Square (organ)", params: { style: 2, f0: 3 } },
    { name: "Flute-like", params: { style: 3, f0: 6 } },

const MODES = [galton, projectile, forceField, pendulum, lorenz, orbits, waves, logistic, boids, solarSystem, rossler, brownian, decay, lagrange, oscillators, electric, lorentz, resonance, life, kuramoto, milkyway, universe, standing, doppler, packet, soliton, timbre];
let modeIndex = 0;
let frameCount = 0;

function setStatus(msg) { $("statustext").textContent = msg; }

let errCount = 0, lastErrTime = 0;
function eqRuntimeError(e) {
  errCount++;
  const now = performance.now();
  if (now - lastErrTime > 400) {
    lastErrTime = now;
    $("eqerr").style.display = "block";
    $("eqerr").textContent = `runtime error (×${errCount}): ${e.message}`;
    $("eqok").style.display = "none";
  }
}

function categoryOrder(cat) {
  const order = ["Classical Dynamics", "Celestial Mechanics", "Statistical", "Waves", "Fields", "Emergent Systems", "Chaos"];
  const i = order.indexOf(cat);
  return i === -1 ? order.length : i;
}
let collapsedCats = new Set();
function buildMenu() {
  const wrap = $("simMenu"); wrap.innerHTML = "";

  const cats = {};
  MODES.forEach(m => { (cats[m.category] = cats[m.category] || []).push(m); });
  const names = Object.keys(cats).sort((a, b) => categoryOrder(a) - categoryOrder(b));
  let anyVisible = false;
  for (const cat of names) {
    const list = cats[cat];
    const matches = q ? list.filter(m => (m.label + " " + m.category).toLowerCase().includes(q)) : list;
    if (q && matches.length === 0) continue;
    anyVisible = true;
    const closed = collapsedCats.has(cat) && !q;
    const sec = document.createElement("div");
    const head = document.createElement("div");
    head.className = "simcat" + (closed ? " closed" : "");
    head.innerHTML = `<span>${cat}</span><span class="caret">▼</span>`;
    head.onclick = () => {
      if (collapsedCats.has(cat)) collapsedCats.delete(cat); else collapsedCats.add(cat);
      buildMenu();
    };
    const rows = document.createElement("div"); rows.className = "simrows";
    for (const m of matches) {
      const idx = MODES.indexOf(m);

      r.onclick = () => switchMode(idx);
      rows.appendChild(r);
    }
    if (closed && !q) rows.style.display = "none";
    sec.append(head, rows);
    wrap.appendChild(sec);
  }
  $("simNone").style.display = anyVisible ? "none" : "block";
}
$("simSearch").addEventListener("input", buildMenu);

    const inp = document.createElement("input");
    inp.type = "range"; inp.min = pd.min; inp.max = pd.max; inp.step = pd.step; inp.value = mode.P[pd.key];
    const val = document.createElement("span"); val.className = "val"; val.textContent = fmtVal(mode.P[pd.key]);
    inp.oninput = () => {
      mode.P[pd.key] = parseFloat(inp.value);
      val.textContent = fmtVal(mode.P[pd.key]);
      saveParam(mode.id, pd.key, mode.P[pd.key]);
      if (mode.onParam) mode.onParam(pd.key);
    };
    row.append(lab, inp, val); wrap.appendChild(row);
  }
}
function fmtVal(v) { return Math.abs(v) >= 100 ? Math.round(v).toString() : (+v).toFixed(2).replace(/\.?0+$/, ""); }

function buildPresets() {
  const wrap = $("presets"); wrap.innerHTML = "";
  if (!mode.presets) { $("presetSection").style.display = "none"; return; }
  $("presetSection").style.display = "block";
  mode.presets.forEach(p => {
    const b = document.createElement("button"); b.className = "preset";
    b.textContent = p.name;
    b.onclick = () => {
      if (p.code) { $("eqeditor").value = p.code; applyEquation(); }
      if (p.params) { Object.assign(mode.P, p.params); buildParams(); }
      if (p.state && mode.applyState) mode.applyState(p.state);
      if (mode.onPreset) mode.onPreset(p);
      markPreset(p.name);
    };
    if (p.name === mode.defaultPresetName) b.classList.add("active");
    wrap.appendChild(b);
  });
  markPreset(null);
}
function markPreset(name) {
  document.querySelectorAll(".preset").forEach(b => b.classList.toggle("active", b.textContent === name));
}

function applyEquation() {
  const code = $("eqeditor").value;
  const spec = mode.eqSpec;      // {argNames, mustReturn}
  const res = compileEq(code, spec.argNames, spec.mustReturn);
  if (res.err) {
    $("eqerr").style.display = "block"; $("eqerr").textContent = res.err;
    $("eqok").style.display = "none";
    return false;
  }
  mode.eq = res.fn;
  if (mode.onEquation) mode.onEquation();
  saveEq(mode.id);
  $("eqerr").style.display = "none";
  $("eqok").style.display = "block";
  setTimeout(() => { $("eqok").style.display = "none"; }, 1200);
  return true;
}

function clearParticles() { particles = []; clearLanding(); }

function switchMode(i) {
  modeIndex = i;
  mode = MODES[i];
  clearParticles();
  // init params from defaults, then restore any saved slider values
  mode.P = {};
  for (const pd of mode.params) mode.P[pd.key] = pd.value;
  const savedP = store().p && store().p[mode.id];
  if (savedP) for (const k in savedP) if (k in mode.P && isFinite(savedP[k])) mode.P[k] = savedP[k];
  mode.init();
  buildMenu();
  const act = document.querySelector(".simrow.active");
  if (act && act.scrollIntoView) act.scrollIntoView({ block: "nearest" });
  $("eqname").textContent = mode.eqName;
  $("eqsig").textContent = mode.eqSig;
  $("eqdesc").textContent = mode.eqDesc;
  const savedEq = store().eq && store().eq[mode.id];
  $("eqeditor").value = savedEq != null ? savedEq : mode.defaultCode;
  buildParams();
  buildPresets();
  applyEquation();
  $("hint").textContent = mode.hint;
  $("histoLabel").textContent = mode.histLabel || "Distribution of final X";
  setStatus(mode.label + " — ready");
  resize();
}

// ---------- histogram ------------------------------------------------------
function drawHistogram() {
  if (!hist.dirty && !hist._force) return;
  hist._force = true; // redraw cheap enough; keep simple
  hctx.clearRect(0, 0, HW, HH);
  const pad = { l: 8, r: 8, t: 8, b: 16 };
  const iw = HW - pad.l - pad.r, ih = HH - pad.t - pad.b;

  const nBins = parseInt($("bins").value, 10);
  const [x0, x1] = (mode && mode.xRange) ? mode.xRange() : [0, W];
  const bins = new Array(nBins).fill(0);
  let n = 0;
  for (const x of hist.xs) {
    if (x < x0 || x > x1) continue;
    let b = Math.floor((x - x0) / (x1 - x0) * nBins);
    b = clamp(b, 0, nBins - 1);
    bins[b]++; n++;
  }
  const maxC = Math.max(1, ...bins);

  // bars
  const bw = iw / nBins;
  for (let i = 0; i < nBins; i++) {
    const h = bins[i] / maxC * ih;
    hctx.fillStyle = "rgba(88,166,255,.75)";
    hctx.fillRect(pad.l + i * bw + 1, pad.t + ih - h, Math.max(1, bw - 2), h);
  }

  // theoretical overlay: normal fit from sample mean/σ
  if (n > 10 && $("showTheory").checked) {
    let mean = 0; for (const x of hist.xs) mean += x; mean /= n;
    let varr = 0; for (const x of hist.xs) varr += (x - mean) * (x - mean); varr /= n;
    const sd = Math.sqrt(varr) || 1;
    hctx.strokeStyle = "#3fb950"; hctx.lineWidth = 2; hctx.beginPath();
    for (let px = 0; px <= iw; px += 2) {
      const x = x0 + px / iw * (x1 - x0);
      const z = (x - mean) / sd;
      const pdf = Math.exp(-0.5 * z * z) / (sd * Math.sqrt(2 * Math.PI));
      // scale so peak matches maxC
      const yv = pdf * n * ((x1 - x0) / nBins) / maxC * ih; // expected count in peak bin
      const py = pad.t + ih - clamp(yv, 0, ih);
      if (px === 0) hctx.moveTo(pad.l + px, py); else hctx.lineTo(pad.l + px, py);
    }
    hctx.stroke();
    // mean marker
    const mx = pad.l + (mean - x0) / (x1 - x0) * iw;
    hctx.strokeStyle = "rgba(63,185,80,.5)"; hctx.setLineDash([4, 4]);
    hctx.beginPath(); hctx.moveTo(mx, pad.t); hctx.lineTo(mx, pad.t + ih); hctx.stroke();
    hctx.setLineDash([]);
  }

  // stats
  let mean = 0, sd = 0, skew = 0, kurt = 0;
  if (n > 0) {
    for (const x of hist.xs) mean += x; mean /= n;
    for (const x of hist.xs) sd += (x - mean) * (x - mean); sd = Math.sqrt(sd / n) || 1;
    for (const x of hist.xs) { const z = (x - mean) / sd; skew += z ** 3; kurt += z ** 4; }
    skew /= n; kurt /= n;
  }
  $("histostats").textContent = `n=${n}  μ=${mean.toFixed(1)}  σ=${sd.toFixed(1)}`;
  // shape stats drawn on the plot itself
  hctx.font = "10px ui-monospace, monospace";
  hctx.fillStyle = "rgba(230,237,243,.55)";
  const norm = Math.abs(skew) < 0.3 && kurt > 2.4 && kurt < 3.6;
  hctx.fillText(`skew ${skew.toFixed(2)}  kurtosis ${kurt.toFixed(2)}  ${norm ? "≈normal ✓" : ""}`, pad.l + 4, pad.t + 10);
  hist.dirty = false;
}

// ---------- export: CSV + PNG ----------------------------------------------
function download(name, blob) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$("btnCsv").onclick = () => {
  const nBins = parseInt($("bins").value, 10);
  const [x0, x1] = mode.xRange ? mode.xRange() : [0, W];
  const bins = new Array(nBins).fill(0);
  for (const x of hist.xs) {
    if (x < x0 || x > x1) continue;
    bins[clamp(Math.floor((x - x0) / (x1 - x0) * nBins), 0, nBins - 1)]++;
  }
  const bw = (x1 - x0) / nBins;
  let csv = `# ${mode.label} — ${mode.histLabel || "distribution"}\nbin_start,bin_end,count\n`;
  bins.forEach((c, i) => { csv += `${(x0 + i * bw).toFixed(4)},${(x0 + (i + 1) * bw).toFixed(4)},${c}\n`; });
  download(`histogram-${mode.id}.csv`, new Blob([csv], { type: "text/csv" }));
  setStatus("CSV exported");
};
$("btnPng").onclick = () => {
  // composite sim canvas + histogram into one snapshot
  const out = document.createElement("canvas");
  out.width = canvas.width; out.height = canvas.height + hcanvas.height;
  const c = out.getContext("2d");
  c.drawImage(canvas, 0, 0);
  c.drawImage(hcanvas, 0, canvas.height);
  out.toBlob(b => { download(`snapshot-${mode.id}.png`, b); setStatus("PNG saved"); });
};

// ---------- persistence: your equations & slider values survive reloads -----
function store() { try { return JSON.parse(localStorage.getItem("simlab") || "{}") || {}; } catch (e) { return {}; } }
function saveStore(mut) {
  try { const s = store(); mut(s); localStorage.setItem("simlab", JSON.stringify(s)); } catch (e) {}
}
const saveEq = modeId => saveStore(s => { (s.eq = s.eq || {})[modeId] = $("eqeditor").value; });
const saveParam = (modeId, key, val) => saveStore(s => { ((s.p = s.p || {})[modeId] = s.p[modeId] || {})[key] = val; });

// ---------- buttons / keys -------------------------------------------------
$("btnDrop").onclick = () => { mode.drop(mode.id === "force" ? mode.P.n : 100); };
$("btnPause").onclick = togglePause;
$("btnClear").onclick = () => { clearParticles(); setStatus("cleared"); };
$("speed").oninput = e => { speedMul = parseFloat(e.target.value); $("speedval").textContent = speedMul + "×"; };
$("eqeditor").addEventListener("input", debounce(applyEquation, 300));
$("eqeditor").addEventListener("keydown", e => {
  if (e.key === "Tab") {
    e.preventDefault();
    const t = e.target, s = t.selectionStart;
    t.value = t.value.slice(0, s) + "  " + t.value.slice(t.selectionEnd);
    t.selectionStart = t.selectionEnd = s + 2;
  }
});  $("eqreset").onclick = () => {
    $("eqeditor").value = mode.defaultCode;
    applyEquation(); markPreset(null);
    saveStore(s => { if (s.eq) delete s.eq[mode.id]; if (s.p) delete s.p[mode.id]; });
    mode.P = {}; for (const pd of mode.params) mode.P[pd.key] = pd.value;
    mode.init(); buildParams();
  };
$("bins").oninput = () => { hist.dirty = true; };
["trails", "showTheory", "colorBySpeed"].forEach(id => $(id).onchange = () => { hist.dirty = true; });

function togglePause() {
  paused = !paused;
  $("btnPause").textContent = paused ? "▶ Resume" : "⏸ Pause";
  $("statusdot").style.background = paused ? "var(--orange)" : "var(--green)";
  setStatus(paused ? "paused" : "running");
}
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); $("btnDrop").click(); }
  else if (e.key === "p" || e.key === "P") togglePause();
  else if (e.key === "c" || e.key === "C") clearParticles();
  else if (e.key >= "1" && e.key <= "9") { const i = parseInt(e.key) - 1; if (i < MODES.length) switchMode(i); }
});

function debounce(fn, ms) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

// ---------- go -------------------------------------------------------------
resize();
switchMode(0);
requestAnimationFrame(frame);
</script>
</body>
</html>
