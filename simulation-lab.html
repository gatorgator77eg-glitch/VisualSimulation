<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics Simulation Lab</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel2: #1c2330;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --orange: #d29922;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column;
  }
  /* ---------- Top bar ---------- */
  #topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px; background: var(--panel);
    border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  #topbar h1 { font-size: 15px; font-weight: 600; margin-right: 8px; white-space: nowrap; }
  #topbar h1 span { color: var(--accent); }
  .tabs { display: flex; gap: 4px; }
  .tab {
    padding: 6px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid transparent; background: transparent; color: var(--muted);
    font-size: 13px; font-weight: 500;
  }
  .tab:hover { color: var(--text); background: var(--panel2); }
  .tab.active { color: var(--text); background: var(--panel2); border-color: var(--border); }
  .topbtn {
    padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
    border: 1px solid var(--border); background: var(--panel2); color: var(--text);
  }
  .topbtn.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; font-weight: 600; }
  .topbtn.primary:hover { background: #388bfd; }
  .topbtn:hover { border-color: var(--accent); }
  .topbtn:disabled { opacity: .45; cursor: default; }
  #speedwrap { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  #speedwrap input { width: 90px; accent-color: var(--accent); }
  #statusdot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); margin-left: auto; }
  #statustext { font-size: 12px; color: var(--muted); }
  /* ---------- Main layout ---------- */
  #main { flex: 1; display: flex; min-height: 0; }
  #sidebar {
    width: 340px; min-width: 280px; background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow-y: auto;
  }
  #stage { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #canvaswrap { flex: 1; position: relative; min-height: 0; background: #090c10; }
  canvas#sim { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hint {
    position: absolute; top: 10px; left: 12px; font-size: 11.5px; color: var(--muted);
    background: rgba(13,17,23,.75); padding: 4px 8px; border-radius: 4px; pointer-events: none;
  }
  /* ---------- Sidebar sections ---------- */
  .section { border-bottom: 1px solid var(--border); padding: 10px 14px; }
  .section h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
  }
  .section h2 .resetlink {
    font-size: 10px; color: var(--accent); cursor: pointer; text-transform: none; letter-spacing: 0;
  }
  #eqname { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--accent); margin-bottom: 6px; }
  #eqsig { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--muted); margin-bottom: 6px; line-height: 1.5; }
  #eqdesc { font-size: 11.5px; color: var(--muted); margin-bottom: 8px; line-height: 1.45; }
  #eqeditor {
    width: 100%; min-height: 84px; resize: vertical;
    background: #0d1117; color: #c9d1d9; border: 1px solid var(--border); border-radius: 6px;
    font-family: ui-monospace, Consolas, "Courier New", monospace; font-size: 12.5px; line-height: 1.5;
    padding: 8px; tab-size: 2;
  }
  #eqeditor:focus { outline: none; border-color: var(--accent); }
  #eqerr {
    display: none; margin-top: 8px; padding: 6px 9px; border-radius: 6px;
    background: rgba(248,81,73,.12); border: 1px solid rgba(248,81,73,.45);
    color: var(--red); font-family: ui-monospace, Consolas, monospace; font-size: 11px;
    white-space: pre-wrap; word-break: break-word; max-height: 90px; overflow-y: auto;
  }
  #eqok { display: none; margin-top: 8px; color: var(--green); font-size: 11px; }
  /* sliders */
  .param { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-size: 12px; }
  .param label { width: 120px; color: var(--muted); flex-shrink: 0; }
  .param input[type=range] { flex: 1; accent-color: var(--accent); }
  .param .val { width: 48px; text-align: right; font-family: ui-monospace, Consolas, monospace; color: var(--text); }
  .togglerow { display: flex; align-items: center; gap: 8px; font-size: 12.5px; margin-bottom: 6px; color: var(--text); }
  .togglerow input { accent-color: var(--accent); }
  /* presets */
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .preset {
    padding: 4px 10px; font-size: 11.5px; border-radius: 5px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel2); color: var(--muted);
  }
  .preset:hover { color: var(--text); border-color: var(--accent); }
  .preset.active { color: var(--accent); border-color: var(--accent); }
  /* ---------- Histogram strip ---------- */
  #histo {
    height: 190px; background: var(--panel); border-top: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  #histohead {
    display: flex; align-items: center; gap: 14px; padding: 5px 14px; font-size: 11.5px; color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  #histohead b { color: var(--text); font-size: 12px; font-weight: 600; }
  #histohead input[type=range] { width: 100px; accent-color: var(--accent); }
  #histostats { margin-left: auto; font-family: ui-monospace, Consolas, monospace; white-space: nowrap; }
  #histohead .topbtn { padding: 2px 8px; font-size: 11px; }
  #histocanvas { flex: 1; width: 100%; display: block; }
  /* keyboard help */
  #keys { font-size: 11px; color: var(--muted); line-height: 1.7; }
  #keys kbd {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 3px;
    padding: 0 5px; font-family: ui-monospace, monospace; font-size: 10px;
  }
  @media (max-width: 900px) { #sidebar { width: 260px; min-width: 220px; } }
  @media (max-width: 760px) {
    #topbar { gap: 6px; padding: 6px 10px; }
    #topbar h1 { font-size: 13px; margin-right: 2px; }
    .tab { padding: 5px 9px; font-size: 12px; }
    .topbtn { padding: 5px 10px; font-size: 12px; }
    #speedwrap input { width: 64px; }
    #main { flex-direction: column; }
    #sidebar {
      width: 100%; min-width: 0; max-height: 38%;
      border-right: none; border-bottom: 1px solid var(--border);
    }
    #canvaswrap { min-height: 180px; }
    #histo { height: 120px; }
    #eqeditor { min-height: 56px; }
    #eqdesc { display: none; }
    #hint { display: none; }
  }
</style>
</head>
<body>
  <div id="topbar">
    <h1>⚛ Physics <span>Sim</span> Lab</h1>
    <div class="tabs" id="tabs"></div>
    <button class="topbtn primary" id="btnDrop">▶ Drop balls</button>
    <button class="topbtn" id="btnPause">⏸ Pause</button>
    <button class="topbtn" id="btnClear">✕ Clear</button>
    <div id="speedwrap">speed <input type="range" id="speed" min="0.25" max="4" step="0.25" value="1"><span id="speedval">1×</span></div>
    <div id="statusdot"></div><div id="statustext">ready</div>
  </div>

  <div id="main">
    <div id="sidebar">
      <div class="section">
        <h2>Equation — edit me live <span class="resetlink" id="eqreset">reset</span></h2>
        <div id="eqname"></div>
        <div id="eqsig"></div>
        <div id="eqdesc"></div>
        <textarea id="eqeditor" spellcheck="false"></textarea>
        <div id="eqerr"></div>
        <div id="eqok">✓ compiled</div>
      </div>
      <div class="section">
        <h2>Parameters</h2>
        <div id="params"></div>
      </div>
      <div class="section" id="presetSection" style="display:none">
        <h2>Presets</h2>
        <div class="presets" id="presets"></div>
      </div>
      <div class="section">
        <h2>Display</h2>
        <div class="togglerow"><input type="checkbox" id="trails"><label for="trails">Motion trails</label></div>
        <div class="togglerow"><input type="checkbox" id="showTheory" checked><label for="showTheory">Theoretical curve overlay</label></div>
        <div class="togglerow"><input type="checkbox" id="colorBySpeed" checked><label for="colorBySpeed">Color particles by speed</label></div>
      </div>
      <div class="section">
        <h2>Shortcuts</h2>
        <div id="keys">
          <kbd>Space</kbd> drop balls &nbsp; <kbd>P</kbd> pause &nbsp; <kbd>C</kbd> clear &nbsp;          <kbd>1..9</kbd> switch mode
        </div>
      </div>
    </div>

    <div id="stage">
      <div id="canvaswrap">
        <canvas id="sim"></canvas>
        <div id="hint"></div>
      </div>
      <div id="histo">
        <div id="histohead">
          <b id="histoLabel">Distribution of final X</b>
          <span>bins <input type="range" id="bins" min="8" max="80" step="2" value="40"></span>
          <button class="topbtn" id="btnCsv" title="Download histogram as CSV">⬇ CSV</button>
          <button class="topbtn" id="btnPng" title="Save canvas snapshot as PNG">⬇ PNG</button>
          <span id="histostats">n=0</span>
        </div>
        <canvas id="histocanvas"></canvas>
      </div>
    </div>
  </div>

<script>
"use strict";
/* =========================================================================
   Physics Simulation Lab — single file, zero dependencies.
   Three modes, each exposing ONE editable equation compiled live with
   new Function(). A shared engine handles particles, fixed-timestep
   integration, rendering, and the final-X histogram.
   ========================================================================= */

// ---------- helpers -------------------------------------------------------
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
// deterministic-ish but fast RNG for reproducible runs
let rngState = 123456789;
function rng() { rngState = (Math.imul(rngState, 1103515245) + 12345) & 0x7fffffff; return rngState / 0x7fffffff; }
function gauss() { // Box-Muller
  let u = 0, v = 0;
  while (u === 0) u = rng();
  while (v === 0) v = rng();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function speedColor(sp, maxSp) {
  const t = clamp(sp / (maxSp || 1), 0, 1);
  const h = 210 - 210 * t;            // blue → red
  return `hsl(${h}, 85%, ${55 + 10 * t}%)`;
}
// classic RK4 for a state vector, f(state) -> derivative
function rk4(s, h, f) {
  const k1 = f(s);
  const s2 = s.map((v, i) => v + h / 2 * k1[i]); const k2 = f(s2);
  const s3 = s.map((v, i) => v + h / 2 * k2[i]); const k3 = f(s3);
  const s4 = s.map((v, i) => v + h * k3[i]);  const k4 = f(s4);
  return s.map((v, i) => v + h / 6 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]));
}
// push a sample into the distribution histogram (bounded)
function pushSample(x) {
  if (!isFinite(x)) return;
  hist.xs.push(x);
  if (hist.xs.length > 40000) hist.xs.splice(0, hist.xs.length - 40000);
  hist.dirty = true;
}

// ---------- equation compiler --------------------------------------------
// Compiles user code into fn(...args) -> value. Returns {fn, err}.
function compileEq(code, argNames, bodyMustReturn) {
  try {
    const f = new Function(...argNames, `"use strict";\n${code}`);
    // smoke test with benign inputs; signatures that destructure arrays/objects
    // will throw on scalars, so a probe exception is not an error — runtime
    // problems are caught (and reported) per-step instead.
    try {
      const probe = argNames.map(() => 0.5);
      const out = f(...probe);
      if (bodyMustReturn && (out === undefined)) return { fn: null, err: "Equation returned undefined — add a `return` statement." };
    } catch (_) { /* probe incompatible with signature — fine */ }
    return { fn: f, err: null };
  } catch (e) { return { fn: null, err: e.message }; }
}

// ---------- canvas setup --------------------------------------------------
const canvas = $("sim"), ctx = canvas.getContext("2d");
const hcanvas = $("histocanvas"), hctx = hcanvas.getContext("2d");
let W = 100, H = 100;                       // css pixel size of sim canvas
let HW = 100, HH = 100;                     // histogram canvas
function resize() {
  const wrap = $("canvaswrap"), r = wrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  W = Math.max(50, r.width); H = Math.max(50, r.height);
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const hr = hcanvas.getBoundingClientRect();
  HW = Math.max(50, hr.width); HH = Math.max(50, hr.height);
  hcanvas.width = HW * dpr; hcanvas.height = HH * dpr;
  hctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (mode) { mode.layout(); mode.draw(); }
  drawHistogram();
}
window.addEventListener("resize", resize);

// ---------- particles ------------------------------------------------------
// Particle: {x,y,vx,vy, alive, data:{...mode-specific}}
let particles = [];
let mode = null;
let paused = false;
let speedMul = 1;
let simTime = 0;

// histogram of "landed" particles' final x
const hist = { xs: [], dirty: true };
function recordLanding(p) { hist.xs.push(p.x); hist.dirty = true; }
function clearLanding() { hist.xs = []; hist.dirty = true; }

// ---------- physics loop --------------------------------------------------
const DT = 1 / 120;                          // fixed physics timestep (s)
let accumulator = 0, lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const realDt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (paused) { mode.draw(); drawHistogram(); return; }
  accumulator += realDt * speedMul;
  let steps = 0;
  while (accumulator >= DT && steps < 600) {   // budget: never wedge the tab
    mode.step(DT);
    simTime += DT;
    accumulator -= DT;
    steps++;
  }
  if (steps >= 600) accumulator = 0;           // drop backlog if overloaded
  frameCount++;
  mode.draw();
  drawHistogram();
}

// ==========================================================================
//  GALTON BOARD
// ==========================================================================
const galton = {
  id: "galton",
  label: "Galton Board",
  hint: "Balls bounce off pegs — each row is a Bernoulli trial. With p=0.5 the bottom histogram converges to the normal distribution.",
  histLabel: "Landing position (binomial → normal)",
  eqName: "pDeflectRight(row, x, params)",
  eqSig: "row: 0..rows-1 · x: ball position (px) · returns: probability [0..1] of going right",
  eqDesc: "Default is a fair coin flip every row → binomial → normal. Make p depend on x (or row) to bias the distribution — the histogram updates live.",
  eqSpec: { argNames: ["row", "x", "params"], mustReturn: true },
  defaultCode:
`// probability that a ball deflects RIGHT at this peg
// row: 0..params.rows-1, x: horizontal position (px)
let p = 0.5;

// try me: bias toward the right edge
// p = 0.5 + 0.3 * row / params.rows;

// try me: wall-hugger (balls cling to sides)
// p = x < params.width/2 ? 0.75 : 0.25;

// try me: sinusoidal bias field
// p = 0.5 + 0.35 * Math.sin(x / 60);

return p;`,
  params: [
    { key: "rows",     label: "Peg rows",    min: 4,  max: 26,   step: 1,     value: 13 },
    { key: "rate",     label: "Balls/sec",   min: 2,  max: 120,  step: 1,     value: 30 },
    { key: "gap",      label: "Peg spacing", min: 18, max: 60,   step: 1,     value: 34 },
    { key: "rest",     label: "Bounciness",  min: 0.2, max: 1.2, step: 0.05,  value: 0.55 },
    { key: "width",    label: "Width (px)",  min: 300, max: 1600, step: 20,   value: 760 },
    { key: "jitter",   label: "Randomness",  min: 0,  max: 1,    step: 0.05,  value: 0.25 },
  ],
  P: {},
  pegs: [], // {x,y}
  spawnAcc: 0,
  binCounts: {},

  init() { this.rebuildPegs(); this.spawnAcc = 0; this.binCounts = {}; },
  rebuildPegs() {
    this.pegs = [];
    const rows = this.P.rows, gap = this.P.gap, cw = this.P.width;
    for (let r = 0; r < rows; r++) {
      const y = 60 + r * gap;
      const count = r + 3;
      for (let i = 0; i < count; i++) {
        // board coords are centered at x=0: pegs span [-half, half]
        this.pegs.push({ x: (i - (count - 1) / 2) * gap, y });
      }
    }
    this.floorY = 60 + rows * gap + gap * 0.9;
  },
  layout() { this.rebuildPegs(); },
  onParam(key) { if (key === "rows" || key === "gap" || key === "width") { clearParticles(); this.rebuildPegs(); this.binCounts = {}; } },

  queue: 0,

  drop(n) {
    this.queue += n;
    setStatus(`${this.queue} balls queued`);
  },

  step(dt) {
    // spawn from queue at the configured rate
    this.spawnAcc += this.P.rate * dt;
    while (this.spawnAcc >= 1 && this.queue > 0 && particles.length < 1500) {
      this.spawnAcc -= 1;
      this.queue--;
      particles.push({
        x: gauss() * 3, y: 20, vx: gauss() * 8, vy: 30,
        alive: true, r: 4.5, data: { row: -1, landed: false }
      });
    }
    if (this.spawnAcc > 1) this.spawnAcc = 1; // don't accumulate while queue empty
    const g = 900; // px/s²
    for (const p of particles) {
      if (!p.alive || p.data.landed) continue;
      p.vy += g * dt;
      // peg collisions — the Galton gate
      for (const peg of this.pegs) {
        const dx = p.x - peg.x, dy = p.y - peg.y;
        const rr = p.r + 5;
        if (dx * dx + dy * dy < rr * rr && p.vy > -20) {
          let pr;
          try { pr = this.eq(p.data.row + 1, peg.x, this.P); }
          catch (e) { eqRuntimeError(e); pr = 0.5; }
          if (!isFinite(pr)) pr = 0.5;
          pr = clamp(pr, 0, 1);
          const dir = rng() < pr ? 1 : -1;
          p.data.row++;
          // deflect: lateral kick proportional to peg gap → per-row spread ≈ gap/2,
          // so after N rows σ ≈ gap·√N/2 (matches binomial theory)
          const kick = this.P.gap * (1.1 + 0.9 * rng() * (0.5 + this.P.jitter));
          p.vx = dir * kick;
          p.vy = -Math.abs(p.vy) * 0.12 * this.P.rest - 20;
          // nudge out of the peg so we don't re-trigger every step
          const d = Math.hypot(dx, dy) || 1;
          p.x = peg.x + (dx / d) * rr * 1.05;
          p.y = peg.y + (dy / d) * rr * 1.05;
          break;
        }
      }
      p.x += p.vx * dt; p.y += p.vy * dt;
      // side walls (funnel)
      const half = this.P.width / 2;
      if (p.x < -half + 4) { p.x = -half + 4; p.vx = Math.abs(p.vx) * 0.4; }
      if (p.x >  half - 4) { p.x =  half - 4; p.vx = -Math.abs(p.vx) * 0.4; }
      // landed in bins
      if (p.y >= this.floorY && !p.data.landed) {
        p.data.landed = true;
        p.vy = 0; p.vx = 0;
        const bin = clamp(Math.floor((p.x + half) / this.P.gap), 0, 999);
        this.binCounts[bin] = (this.binCounts[bin] || 0) + 1;
        p.y = this.floorY - 4 - Math.min(this.binCounts[bin], 16) * 7;
        recordLanding(p);
      }
    }
  },

  draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    // auto-fit: scale the board to the visible canvas
    const fit = Math.min(W / (this.P.width + 60), H / (this.floorY + 110));
    ctx.translate(W / 2, 8);
    ctx.scale(fit, fit);
    const half = this.P.width / 2;
    // funnel walls
    ctx.strokeStyle = "#30363d"; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-half, 0); ctx.lineTo(-half, this.floorY + 40);
    ctx.moveTo(half, 0);  ctx.lineTo(half, this.floorY + 40);
    ctx.stroke();
    // pegs
    ctx.fillStyle = "#58a6ff";
    for (const peg of this.pegs) { ctx.beginPath(); ctx.arc(peg.x, peg.y, 3.2, 0, 7); ctx.fill(); }
    // floor + bins
    ctx.strokeStyle = "#8b949e"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-half, this.floorY); ctx.lineTo(half, this.floorY); ctx.stroke();
    // bin separators
    const bw = this.P.gap;
    ctx.strokeStyle = "#21262d"; ctx.lineWidth = 1.5;
    for (let x = -half; x <= half + 1; x += bw) {
      ctx.beginPath(); ctx.moveTo(x, this.floorY); ctx.lineTo(x, this.floorY + 70); ctx.stroke();
    }
    // landed balls stack (visual)
    ctx.fillStyle = "#3fb950";
    for (const p of particles) {
      if (!p.data.landed) continue;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }
    // flying balls
    const maxSp = 400;
    for (const p of particles) {
      if (!p.alive || p.data.landed) continue;
      ctx.fillStyle = $("colorBySpeed").checked ? speedColor(Math.hypot(p.vx, p.vy), maxSp) : "#e6edf3";
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }
    ctx.restore();
  },

  // landing x range for histogram normalization
  xRange() { return [-this.P.width / 2, this.P.width / 2]; },
};

// ==========================================================================
//  PROJECTILE WITH DRAG
// ==========================================================================
const projectile = {
  id: "projectile",
  label: "Projectile + Drag",
  hint: "Launch balls from the bottom-left with spread in angle & speed. The drag equation shapes their arc — and the landing histogram.",
  histLabel: "Landing distance",
  eqName: "dragForce(v, params)",
  eqSig: "v = {x, y} velocity (px/s) · returns: {x, y} drag force (px/s²)",
  eqDesc: "Classic: F = -k·|v|²·v̂ (quadratic). Try linear drag F = -k·v, or negative k to see the histogram fly apart.",
  eqSpec: { argNames: ["v", "params"], mustReturn: true },
  defaultCode:
`// v = {x, y} — current velocity (px/s)
// params: speed, angle, k (drag coeff), gravity, spread
const k = params.k;

  y: -k * speed * v.y
};

    ];
  },
  setBodies(bodies) {
    this.bodies = bodies.map(b => ({ ...b }));
    this.trails = this.bodies.map(() => []);
  },
  init() { this.setBodies(this.fig8()); },
  layout() {},
  onParam() {},
  onPreset(p) {
    if (p.bodies) this.setBodies(p.bodies);
    else if (p.useFig8) this.setBodies(this.fig8());
  },
  drop(n) { this.init(); setStatus("orbits reset"); },

  step(dt) {
    try {
      // leapfrog (kick-drift-kick), 2 substeps per physics tick
      const h = dt * 0.6;
      for (let sub = 0; sub < 2; sub++) {
        let accs = this.eq(this.bodies, this.P);
        if (!Array.isArray(accs) || accs.length !== this.bodies.length) { eqRuntimeError(new Error("return one {x,y} per body")); return; }
        for (let i = 0; i < this.bodies.length; i++) {
          const b = this.bodies[i], a = accs[i];
          if (!a || !isFinite(a.x) || !isFinite(a.y)) { eqRuntimeError(new Error("non-finite acceleration")); return; }
          b.vx += a.x * h * 0.5; b.vy += a.y * h * 0.5;
        }
        for (const b of this.bodies) { b.x += b.vx * h; b.y += b.vy * h; }
        accs = this.eq(this.bodies, this.P);
        for (let i = 0; i < this.bodies.length; i++) {
          const b = this.bodies[i], a = accs[i];
          b.vx += a.x * h * 0.5; b.vy += a.y * h * 0.5;
        }
      }
      for (let i = 0; i < this.bodies.length; i++) {
        const tr = this.trails[i];
        tr.push(this.bodies[i].x, this.bodies[i].y);
        if (tr.length > this.P.trailLen * 2) tr.splice(0, 2);
      }
      pushSample(this.bodies[0].x);
      // escape guard: re-center if a body flung to oblivion
      if (this.bodies.some(b => !isFinite(b.x) || Math.abs(b.x) > 50 || Math.abs(b.y) > 50)) this.init();
    } catch (e) { eqRuntimeError(e); }
  },

  draw() {
    ctx.clearRect(0, 0, W, H);
    const sc = Math.min(W, H) * 0.40, cx = W / 2, cy = H / 2;
    const cols = ["#58a6ff", "#f85149", "#3fb950", "#d29922", "#bc8cff"];
    for (let i = 0; i < this.bodies.length; i++) {
      const b = this.bodies[i], tr = this.trails[i], col = cols[i % cols.length];

      const X = cx + b.x * sc, Y = cy - b.y * sc;

  eqSpec: { argNames: ["boid", "flock", "params"], mustReturn: true },
  defaultCode:
`// Reynolds' three rules — each computes a desired velocity,
// then steers toward it (steer = desired − current).
// flock = neighbors within params.radius
const k = flock.length || 1;
let sepX = 0, sepY = 0, aliX = 0, aliY = 0, cohX = 0, cohY = 0;
for (const q of flock) {
  const dx = boid.x - q.x, dy = boid.y - q.y;
  const d2 = dx*dx + dy*dy + 1e-6;
  sepX += dx / d2; sepY += dy / d2;   // separation: inverse-square push away
  aliX += q.vx;    aliY += q.vy;      // alignment: match neighbor heading
  cohX += q.x;     cohY += q.y;       // cohesion: pull toward local center
}
const maxS = params.maxSpeed;
const steer = (dx, dy) => {           // desired velocity → steering force
  const m = Math.hypot(dx, dy);
  return m < 1e-6 ? [0, 0] : [dx / m * maxS - boid.vx, dy / m * maxS - boid.vy];
};
const [sx, sy] = steer(sepX, sepY);
const [ax, ay] = steer(aliX / k, aliY / k);
const [cx2, cy2] = steer(cohX / k - boid.x, cohY / k - boid.y);
return {
  x: params.sep * sx + params.ali * ax + params.coh * cx2,
  y: params.sep * sy + params.ali * ay + params.coh * cy2,

const MODES = [galton, projectile, forceField, pendulum, lorenz, orbits, waves, logistic, boids];
let modeIndex = 0;
let frameCount = 0;

function setStatus(msg) { $("statustext").textContent = msg; }

let errCount = 0, lastErrTime = 0;
function eqRuntimeError(e) {
  errCount++;
  const now = performance.now();
  if (now - lastErrTime > 400) {
    lastErrTime = now;
    $("eqerr").style.display = "block";
    $("eqerr").textContent = `runtime error (×${errCount}): ${e.message}`;
    $("eqok").style.display = "none";
  }
}

function buildTabs() {
  const wrap = $("tabs"); wrap.innerHTML = "";
  MODES.forEach((m, i) => {
    const b = document.createElement("button");
    b.className = "tab" + (i === modeIndex ? " active" : "");
    b.textContent = m.label;
    b.onclick = () => switchMode(i);
    wrap.appendChild(b);
  });
}

function buildParams() {
  const wrap = $("params"); wrap.innerHTML = "";
  for (const pd of mode.params) {
    const row = document.createElement("div"); row.className = "param";
    const lab = document.createElement("label"); lab.textContent = pd.label;
    const inp = document.createElement("input");
    inp.type = "range"; inp.min = pd.min; inp.max = pd.max; inp.step = pd.step; inp.value = mode.P[pd.key];
    const val = document.createElement("span"); val.className = "val"; val.textContent = fmtVal(mode.P[pd.key]);
    inp.oninput = () => {
      mode.P[pd.key] = parseFloat(inp.value);
      val.textContent = fmtVal(mode.P[pd.key]);
      saveParam(mode.id, pd.key, mode.P[pd.key]);
      if (mode.onParam) mode.onParam(pd.key);
    };
    row.append(lab, inp, val); wrap.appendChild(row);
  }
}
function fmtVal(v) { return Math.abs(v) >= 100 ? Math.round(v).toString() : (+v).toFixed(2).replace(/\.?0+$/, ""); }

function buildPresets() {
  const wrap = $("presets"); wrap.innerHTML = "";
  if (!mode.presets) { $("presetSection").style.display = "none"; return; }
  $("presetSection").style.display = "block";
  mode.presets.forEach(p => {
    const b = document.createElement("button"); b.className = "preset";
    b.textContent = p.name;
    b.onclick = () => {
      if (p.code) { $("eqeditor").value = p.code; applyEquation(); }
      if (p.params) { Object.assign(mode.P, p.params); buildParams(); }
      if (p.state && mode.applyState) mode.applyState(p.state);
      if (mode.onPreset) mode.onPreset(p);
      markPreset(p.name);
    };
    if (p.name === mode.defaultPresetName) b.classList.add("active");
    wrap.appendChild(b);
  });
  markPreset(null);
}
function markPreset(name) {
  document.querySelectorAll(".preset").forEach(b => b.classList.toggle("active", b.textContent === name));
}

function applyEquation() {
  const code = $("eqeditor").value;
  const spec = mode.eqSpec;      // {argNames, mustReturn}
  const res = compileEq(code, spec.argNames, spec.mustReturn);
  if (res.err) {
    $("eqerr").style.display = "block"; $("eqerr").textContent = res.err;
    $("eqok").style.display = "none";
    return false;
  }
  mode.eq = res.fn;
  if (mode.onEquation) mode.onEquation();
  saveEq(mode.id);
  $("eqerr").style.display = "none";
  $("eqok").style.display = "block";
  setTimeout(() => { $("eqok").style.display = "none"; }, 1200);
  return true;
}

function clearParticles() { particles = []; clearLanding(); }

function switchMode(i) {
  modeIndex = i;
  mode = MODES[i];
  clearParticles();
  // init params from defaults, then restore any saved slider values
  mode.P = {};
  for (const pd of mode.params) mode.P[pd.key] = pd.value;
  const savedP = store().p && store().p[mode.id];
  if (savedP) for (const k in savedP) if (k in mode.P && isFinite(savedP[k])) mode.P[k] = savedP[k];
  mode.init();
  buildTabs();
  $("eqname").textContent = mode.eqName;
  $("eqsig").textContent = mode.eqSig;
  $("eqdesc").textContent = mode.eqDesc;
  const savedEq = store().eq && store().eq[mode.id];
  $("eqeditor").value = savedEq != null ? savedEq : mode.defaultCode;
  buildParams();
  buildPresets();
  applyEquation();
  $("hint").textContent = mode.hint;
  $("histoLabel").textContent = mode.histLabel || "Distribution of final X";
  setStatus(mode.label + " — ready");
  resize();
}

// ---------- histogram ------------------------------------------------------
function drawHistogram() {
  if (!hist.dirty && !hist._force) return;
  hist._force = true; // redraw cheap enough; keep simple
  hctx.clearRect(0, 0, HW, HH);
  const pad = { l: 8, r: 8, t: 8, b: 16 };
  const iw = HW - pad.l - pad.r, ih = HH - pad.t - pad.b;

  const nBins = parseInt($("bins").value, 10);
  const [x0, x1] = (mode && mode.xRange) ? mode.xRange() : [0, W];
  const bins = new Array(nBins).fill(0);
  let n = 0;
  for (const x of hist.xs) {
    if (x < x0 || x > x1) continue;
    let b = Math.floor((x - x0) / (x1 - x0) * nBins);
    b = clamp(b, 0, nBins - 1);
    bins[b]++; n++;
  }
  const maxC = Math.max(1, ...bins);

  // bars
  const bw = iw / nBins;
  for (let i = 0; i < nBins; i++) {
    const h = bins[i] / maxC * ih;
    hctx.fillStyle = "rgba(88,166,255,.75)";
    hctx.fillRect(pad.l + i * bw + 1, pad.t + ih - h, Math.max(1, bw - 2), h);
  }

  // theoretical overlay: normal fit from sample mean/σ
  if (n > 10 && $("showTheory").checked) {
    let mean = 0; for (const x of hist.xs) mean += x; mean /= n;
    let varr = 0; for (const x of hist.xs) varr += (x - mean) * (x - mean); varr /= n;
    const sd = Math.sqrt(varr) || 1;
    hctx.strokeStyle = "#3fb950"; hctx.lineWidth = 2; hctx.beginPath();
    for (let px = 0; px <= iw; px += 2) {
      const x = x0 + px / iw * (x1 - x0);
      const z = (x - mean) / sd;
      const pdf = Math.exp(-0.5 * z * z) / (sd * Math.sqrt(2 * Math.PI));
      // scale so peak matches maxC
      const yv = pdf * n * ((x1 - x0) / nBins) / maxC * ih; // expected count in peak bin
      const py = pad.t + ih - clamp(yv, 0, ih);
      if (px === 0) hctx.moveTo(pad.l + px, py); else hctx.lineTo(pad.l + px, py);
    }
    hctx.stroke();
    // mean marker
    const mx = pad.l + (mean - x0) / (x1 - x0) * iw;
    hctx.strokeStyle = "rgba(63,185,80,.5)"; hctx.setLineDash([4, 4]);
    hctx.beginPath(); hctx.moveTo(mx, pad.t); hctx.lineTo(mx, pad.t + ih); hctx.stroke();
    hctx.setLineDash([]);
  }

  // stats
  let mean = 0, sd = 0, skew = 0, kurt = 0;
  if (n > 0) {
    for (const x of hist.xs) mean += x; mean /= n;
    for (const x of hist.xs) sd += (x - mean) * (x - mean); sd = Math.sqrt(sd / n) || 1;
    for (const x of hist.xs) { const z = (x - mean) / sd; skew += z ** 3; kurt += z ** 4; }
    skew /= n; kurt /= n;
  }
  $("histostats").textContent = `n=${n}  μ=${mean.toFixed(1)}  σ=${sd.toFixed(1)}`;
  // shape stats drawn on the plot itself
  hctx.font = "10px ui-monospace, monospace";
  hctx.fillStyle = "rgba(230,237,243,.55)";
  const norm = Math.abs(skew) < 0.3 && kurt > 2.4 && kurt < 3.6;
  hctx.fillText(`skew ${skew.toFixed(2)}  kurtosis ${kurt.toFixed(2)}  ${norm ? "≈normal ✓" : ""}`, pad.l + 4, pad.t + 10);
  hist.dirty = false;
}

// ---------- export: CSV + PNG ----------------------------------------------
function download(name, blob) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$("btnCsv").onclick = () => {
  const nBins = parseInt($("bins").value, 10);
  const [x0, x1] = mode.xRange ? mode.xRange() : [0, W];
  const bins = new Array(nBins).fill(0);
  for (const x of hist.xs) {
    if (x < x0 || x > x1) continue;
    bins[clamp(Math.floor((x - x0) / (x1 - x0) * nBins), 0, nBins - 1)]++;
  }
  const bw = (x1 - x0) / nBins;
  let csv = `# ${mode.label} — ${mode.histLabel || "distribution"}\nbin_start,bin_end,count\n`;
  bins.forEach((c, i) => { csv += `${(x0 + i * bw).toFixed(4)},${(x0 + (i + 1) * bw).toFixed(4)},${c}\n`; });
  download(`histogram-${mode.id}.csv`, new Blob([csv], { type: "text/csv" }));
  setStatus("CSV exported");
};
$("btnPng").onclick = () => {
  // composite sim canvas + histogram into one snapshot
  const out = document.createElement("canvas");
  out.width = canvas.width; out.height = canvas.height + hcanvas.height;
  const c = out.getContext("2d");
  c.drawImage(canvas, 0, 0);
  c.drawImage(hcanvas, 0, canvas.height);
  out.toBlob(b => { download(`snapshot-${mode.id}.png`, b); setStatus("PNG saved"); });
};

// ---------- persistence: your equations & slider values survive reloads -----
function store() { try { return JSON.parse(localStorage.getItem("simlab") || "{}") || {}; } catch (e) { return {}; } }
function saveStore(mut) {
  try { const s = store(); mut(s); localStorage.setItem("simlab", JSON.stringify(s)); } catch (e) {}
}
const saveEq = modeId => saveStore(s => { (s.eq = s.eq || {})[modeId] = $("eqeditor").value; });
const saveParam = (modeId, key, val) => saveStore(s => { ((s.p = s.p || {})[modeId] = s.p[modeId] || {})[key] = val; });

// ---------- buttons / keys -------------------------------------------------
$("btnDrop").onclick = () => { mode.drop(mode.id === "force" ? mode.P.n : 100); };
$("btnPause").onclick = togglePause;
$("btnClear").onclick = () => { clearParticles(); setStatus("cleared"); };
$("speed").oninput = e => { speedMul = parseFloat(e.target.value); $("speedval").textContent = speedMul + "×"; };
$("eqeditor").addEventListener("input", debounce(applyEquation, 300));
$("eqeditor").addEventListener("keydown", e => {
  if (e.key === "Tab") {
    e.preventDefault();
    const t = e.target, s = t.selectionStart;
    t.value = t.value.slice(0, s) + "  " + t.value.slice(t.selectionEnd);
    t.selectionStart = t.selectionEnd = s + 2;
  }
});  $("eqreset").onclick = () => {
    $("eqeditor").value = mode.defaultCode;
    applyEquation(); markPreset(null);
    saveStore(s => { if (s.eq) delete s.eq[mode.id]; if (s.p) delete s.p[mode.id]; });
    mode.P = {}; for (const pd of mode.params) mode.P[pd.key] = pd.value;
    mode.init(); buildParams();
  };
$("bins").oninput = () => { hist.dirty = true; };
["trails", "showTheory", "colorBySpeed"].forEach(id => $(id).onchange = () => { hist.dirty = true; });

function togglePause() {
  paused = !paused;
  $("btnPause").textContent = paused ? "▶ Resume" : "⏸ Pause";
  $("statusdot").style.background = paused ? "var(--orange)" : "var(--green)";
  setStatus(paused ? "paused" : "running");
}
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); $("btnDrop").click(); }
  else if (e.key === "p" || e.key === "P") togglePause();
  else if (e.key === "c" || e.key === "C") clearParticles();
  else if (e.key >= "1" && e.key <= "9") { const i = parseInt(e.key) - 1; if (i < MODES.length) switchMode(i); }
});

function debounce(fn, ms) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

// ---------- go -------------------------------------------------------------
resize();
switchMode(0);
requestAnimationFrame(frame);
</script>
</body>
</html>
